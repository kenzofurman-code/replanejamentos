  <!-- Modal: Importar nova versão de Orçamento / Distribuição / Medição -->
  <div 
    x-show="showVersionImportModal" 
    x-cloak 
    class="fixed inset-0 z-50 overflow-y-auto flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-xs">
    <div class="bg-white rounded-2xl max-w-md w-full shadow-2xl border border-slate-200 p-6 space-y-4" @click.outside="showVersionImportModal = false">
      <div class="flex items-center justify-between border-b border-slate-100 pb-3">
        <div class="flex items-center space-x-2">
          <div class="w-8 h-8 rounded-lg bg-blue-50 text-blue-600 flex items-center justify-center">
            <i data-lucide="upload" class="w-4 h-4"></i>
          </div>
          <div>
            <h3 class="font-bold text-slate-900 text-sm">Importar Nova Versão — <span x-text="domainLabel(importDomain)"></span></h3>
            <p class="text-[10px] text-slate-500">A versão importada passa a ser a ativa. As edições feitas na tela são salvas nela.</p>
          </div>
        </div>
        <button @click="showVersionImportModal = false" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>

      <div class="space-y-3 text-xs">
        <div>
          <label class="block font-bold text-slate-700 mb-1">Nome da Versão:</label>
          <input 
            type="text" 
            x-model="versionImportName" 
            placeholder="Ex: Orçamento Revisão B" 
            class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-1.5 outline-none focus:border-blue-500">
        </div>

        <div>
          <label class="block font-bold text-slate-700 mb-1">Planilha (.xlsx no modelo desta tela):</label>
          <div class="border-2 border-dashed border-slate-300 rounded-xl p-4 text-center hover:bg-slate-50 cursor-pointer" @click="$refs.versionFileInput.click()">
            <i data-lucide="file-up" class="w-8 h-8 text-blue-500 mx-auto mb-1"></i>
            <p class="font-semibold text-slate-700" x-text="versionImportFile ? versionImportFile.name : 'Clique para selecionar a planilha'"></p>
          </div>
          <input type="file" x-ref="versionFileInput" @change="versionImportFile = $event.target.files[0]" accept=".xlsx,.xlsm" class="hidden">
          <button @click="downloadSplitTemplate(importDomain)" class="mt-2 text-[11px] text-blue-600 hover:underline font-semibold">
            Baixar planilha modelo desta tela
          </button>
        </div>
      </div>

      <div class="flex items-center justify-end space-x-2 pt-2 border-t border-slate-100">
        <button @click="showVersionImportModal = false" class="px-3 py-1.5 rounded-lg border border-slate-300 text-slate-600 font-semibold hover:bg-slate-50 text-xs">Cancelar</button>
        <button 
          @click="submitVersionImport()" 
          :disabled="!versionImportFile || isUploading"
          class="px-4 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-semibold text-xs shadow-sm disabled:opacity-40 flex items-center space-x-1.5">
          <i data-lucide="upload-cloud" class="w-3.5 h-3.5"></i>
          <span x-text="isUploading ? 'Importando...' : 'Confirmar Importação'"></span>
        </button>
      </div>
    </div>
  </div>
