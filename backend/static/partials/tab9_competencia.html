                    <th class="p-2.5">Mês</th>

                    <th class="p-2.5 text-right text-slate-500">Teórico Comp.</th>

                    <th class="p-2.5 text-right text-teal-700">Fin. Mão de Obra</th>
                    <th class="p-2.5 text-right font-black text-teal-800 bg-teal-50/50">Financeiro Total</th>

                </thead>
                <tbody class="divide-y divide-slate-100">

                      <td class="p-2.5 text-center">
                        <span

                          x-text="s.realizado ? 'Realizado' : 'Projetado'"></span>
                      </td>
                      <td class="p-2.5 text-right text-slate-700" x-text="formatCurrency(s.competenciaMaterial)"></td>
                      <td class="p-2.5 text-right text-slate-700" x-text="formatCurrency(s.competenciaMaoDeObra)"></td>
                      <td class="p-2.5 text-right font-bold text-blue-800 bg-blue-50/30" x-text="formatCurrency(s.competenciaMensal)"></td>
                      <td class="p-2.5 text-right text-slate-400" x-text="formatCurrency(s.teoricoCompetenciaMensal)"></td>
                      <td class="p-2.5 text-right text-slate-700" x-text="formatCurrency(s.financeiroMaterial)"></td>
                      <td class="p-2.5 text-right text-slate-700" x-text="formatCurrency(s.financeiroMaoDeObra)"></td>
                      <td class="p-2.5 text-right font-bold text-teal-800 bg-teal-50/30" x-text="formatCurrency(s.financeiroMensal)"></td>
                      <td class="p-2.5 text-right text-slate-400" x-text="formatCurrency(s.teoricoFinanceiroMensal)"></td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>

              <span class="text-[11px] text-slate-500 font-normal">Estouros de custo ou saldos sem físico futuro</span>
            </div>
            <div class="overflow-x-auto max-h-[350px] scrollbar-thin">
              <table class="w-full text-left text-xs border-collapse">
                <thead class="bg-slate-50 text-slate-600 font-bold uppercase text-[10px] border-b border-slate-200 sticky top-0 z-10">
                  <tr>
                    <th class="p-2.5">Código</th>
                    <th class="p-2.5">Descrição da Etapa</th>
                    <th class="p-2.5 text-right">Custo Projetado</th>
                    <th class="p-2.5 text-right">Incorrido Real</th>
                    <th class="p-2.5 text-right">Saldo a Projetar</th>
                    <th class="p-2.5 text-center">Status / Alerta</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                  <template x-for="et in (curvasRealizadoData?.etapas || [])" :key="et.codigo_etapa">
                    <tr class="hover:bg-slate-50/70">
                      <td class="p-2.5 font-mono font-bold text-slate-800" x-text="et.codigo_etapa"></td>
                      <td class="p-2.5 text-slate-700 font-medium" x-text="et.nome"></td>
                      <td class="p-2.5 text-right font-semibold text-slate-800" x-text="formatCurrency(et.projetado)"></td>
                      <td class="p-2.5 text-right font-semibold text-blue-700" x-text="formatCurrency(et.realizado)"></td>
                      <td class="p-2.5 text-right font-bold text-slate-900" x-text="formatCurrency(et.saldoProjetado)"></td>
                      <td class="p-2.5 text-center">
                        <template x-if="et.alerta === 'excedente'">
                          <span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-rose-100 text-rose-700 border border-rose-200">
                            Excedente (+ <span x-text="formatCurrency(et.excedente)"></span>)
                          </span>
                        </template>
                        <template x-if="et.alerta === 'pendente'">
                          <span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-purple-100 text-purple-700 border border-purple-200">
                            Pendente s/ Físico (<span x-text="formatCurrency(et.pendente)"></span>)
                          </span>
                        </template>
                        <template x-if="!et.alerta">
                          <span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-700">
                            Regular
                          </span>
                        </template>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </div>

              <div class="flex items-center space-x-3 text-xs">

                  <span>Competência (Contábil)</span>

                  <span>Financeiro (Desembolso)</span>
                </span>

            <div class="h-80 sm:h-96 w-full relative">
              <canvas id="curvasTripleChartCanvas" class="w-full h-full"></canvas>

        <div x-show="curvasSubView === 'analitica'" class="space-y-4">

            <div class="relative w-full sm:w-72">
              <i data-lucide="search" class="w-3.5 h-3.5 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
              <input 
                type="text" 
                x-model="searchAnalitica"

            </div>

            <div class="flex items-center space-x-2">
              <span class="text-slate-500 text-[11px]">Tipo:</span>

                class="px-2.5 py-1 rounded text-[11px] transition">
                Todos
              </button>
              <button 
                @click="filtroTipoAnalitica = 'MATERIAL'"
                :class="filtroTipoAnalitica === 'MATERIAL' ? 'bg-amber-600 text-white font-bold' : 'bg-slate-100 text-slate-600'"
                class="px-2.5 py-1 rounded text-[11px] transition">
                Material
              </button>
              <button 
                @click="filtroTipoAnalitica = 'MAO_DE_OBRA'"

              </button>
            </div>

                    <th class="p-2.5">Descrição</th>

                    <th class="p-2.5 text-center text-blue-700">Mês Competência (NF)</th>
                    <th class="p-2.5 text-center text-teal-700">Mês Financeiro (Pgto)</th>

                    <th class="p-2.5">Condição / Motivo</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                  <template x-for="(fl, idx) in getFilteredFluxos()" :key="idx">
                    <tr class="hover:bg-slate-50/80">

                      </td>
                      <td class="p-2.5 text-center font-mono text-slate-600" x-text="fl.fis || '—'"></td>
                      <td class="p-2.5 text-center font-mono font-bold text-blue-700 bg-blue-50/20" x-text="fl.comp"></td>
                      <td class="p-2.5 text-center font-mono font-bold text-teal-700 bg-teal-50/20" x-text="fl.fin"></td>
                      <td class="p-2.5 text-right font-extrabold text-slate-900" x-text="formatCurrency(fl.valor)"></td>
                      <td class="p-2.5 text-slate-500 text-[11px]" x-text="fl.mFin || fl.mComp || '—'"></td>
