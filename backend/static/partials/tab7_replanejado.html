    <!-- TAB 7: REPLANEJADO (SALDO NÍVEL 6 COM SELETOR DE CORTE E VERSÃO) -->
    <template x-if="activeTab === 'replanejado'">
      <div class="bg-white rounded-xl shadow-xs border border-slate-200 overflow-hidden">
        <div class="p-3 border-b border-slate-200 flex flex-wrap items-center justify-between gap-3">
          <div>
            <h3 class="font-bold text-slate-900 text-xs">Replanejado (Distribuição do Saldo a Nível 6)</h3>
            <p class="text-[10px] text-slate-500">Saldo restante redistribuído a partir do mês selecionado com a versão do cronograma ativa</p>
          </div>

          <div class="flex flex-wrap items-center gap-2">
            <!-- Recalculate From Month Selector -->
            <div class="flex items-center space-x-1.5 bg-slate-50 border border-slate-200 px-2.5 py-1 rounded">
              <span class="text-[11px] font-semibold text-slate-600">Recalcular a partir de:</span>
              <select 
                x-model.number="cutoffMedNum" 
                @change="runSimulation()"
                class="bg-white border border-slate-300 text-slate-800 text-xs font-semibold rounded px-1.5 py-0.5 outline-none">
                <template x-for="i in 36" :key="i">
                  <option :value="i" x-text="'Medição ' + i"></option>
                </template>
              </select>
            </div>

            <!-- Schedule Version Selector -->
            <div class="flex items-center space-x-1 text-xs">
              <span class="text-slate-500 font-semibold">Cronograma:</span>
              <select 
                x-model="selectedVersionId" 
                @change="runSimulation()"
                class="bg-slate-50 border border-slate-300 text-slate-800 rounded px-2 py-1 text-xs font-semibold outline-none">
                <template x-for="v in replanResult?.tab_cronograma?.versions" :key="v.id">
                  <option :value="v.id" x-text="v.name"></option>
                </template>
              </select>
            </div>

            <!-- Level Filter Selector -->
            <div class="flex items-center bg-slate-100 p-0.5 rounded-lg border border-slate-200 text-[11px] font-semibold">
              <button 
                @click="levelFilterReplan = 2; replanPage = 1;" 
                :class="levelFilterReplan === 2 ? 'bg-indigo-600 text-white shadow-xs' : 'text-slate-600 hover:text-slate-900'" 
                class="px-2 py-0.5 rounded transition">
                Até N2
              </button>
              <button 
                @click="levelFilterReplan = 3; replanPage = 1;" 
                :class="levelFilterReplan === 3 ? 'bg-indigo-600 text-white shadow-xs' : 'text-slate-600 hover:text-slate-900'" 
                class="px-2 py-0.5 rounded transition">
                Até N3
              </button>
              <button 
                @click="levelFilterReplan = 4; replanPage = 1;" 
                :class="levelFilterReplan === 4 ? 'bg-indigo-600 text-white shadow-xs' : 'text-slate-600 hover:text-slate-900'" 
                class="px-2 py-0.5 rounded transition">
                Até N4
              </button>
              <button 
                @click="levelFilterReplan = 5; replanPage = 1;" 
                :class="levelFilterReplan === 5 ? 'bg-indigo-600 text-white shadow-xs' : 'text-slate-600 hover:text-slate-900'" 
                class="px-2 py-0.5 rounded transition">
                Até N5
              </button>
              <button 
                @click="levelFilterReplan = 0; replanPage = 1;" 
                :class="levelFilterReplan === 0 ? 'bg-indigo-600 text-white shadow-xs' : 'text-slate-600 hover:text-slate-900'" 
                class="px-2 py-0.5 rounded transition">
                Todos (N5+N6)
              </button>
            </div>

            <!-- Saldo em % Toggle Checkbox -->
            <label class="flex items-center space-x-1.5 bg-slate-100 hover:bg-slate-200/60 border border-slate-200 px-2 py-1 rounded-lg text-[11px] font-semibold text-slate-700 cursor-pointer select-none transition">
              <input 
                type="checkbox" 
                x-model="replanSaldoInPct" 
                class="w-3.5 h-3.5 rounded border-slate-300 text-indigo-600 focus:ring-0 cursor-pointer">
              <span>Saldo em %</span>
            </label>

            <!-- View Mode Switcher (% Obra / % do Serviço / R$) -->
            <div class="flex items-center bg-slate-100 p-0.5 rounded-lg border border-slate-200 text-[11px] font-semibold">
              <button 
                @click="ffRepViewMode = 'pct'" 
                :class="ffRepViewMode === 'pct' ? 'bg-white text-indigo-700 shadow-xs' : 'text-slate-600 hover:text-slate-900'"
                class="px-2.5 py-0.5 rounded transition">
                % Obra
              </button>
              <button 
                @click="ffRepViewMode = 'pct_service'" 
                :class="ffRepViewMode === 'pct_service' ? 'bg-white text-indigo-700 shadow-xs' : 'text-slate-600 hover:text-slate-900'"
                class="px-2.5 py-0.5 rounded transition">
                % do Serviço
              </button>
              <button 
                @click="ffRepViewMode = 'pct_etapa'" 
                :class="ffRepViewMode === 'pct_etapa' ? 'bg-white text-indigo-700 shadow-xs' : 'text-slate-600 hover:text-slate-900'"
                class="px-2.5 py-0.5 rounded transition"
                title="Para o Nível 6, mostra a evolução da própria etapa de 0% a 100%">
                % Etapa
              </button>
              <button 
                @click="ffRepViewMode = 'val'" 
                :class="ffRepViewMode === 'val' ? 'bg-white text-indigo-700 shadow-xs' : 'text-slate-600 hover:text-slate-900'"
                class="px-2.5 py-0.5 rounded transition">
                R$ Financeiro
              </button>
            </div>

            <input 
              type="text" 
              x-model="searchReplan" 
              @input="replanPage = 1"
              placeholder="Filtrar replanejado..." 
              class="bg-slate-50 border border-slate-300 rounded px-2 py-1 text-xs w-36 outline-none">

            <!-- Botões Rápidos de Carregamento & Navegação -->
            <button 
              x-show="paginatedReplanRows.length < filteredReplanRows.length"
              @click="loadAllReplanRows()" 
              class="flex items-center space-x-1 px-2 py-1 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 rounded text-[11px] font-semibold transition shadow-2xs"
              title="Carregar todas as linhas da tabela de uma vez">
              <i data-lucide="chevrons-down" class="w-3.5 h-3.5"></i>
              <span>Abrir Tudo</span>
            </button>

            <button 
              @click="scrollToReplanBottom()" 
              class="flex items-center space-x-1 px-2 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-300 rounded text-[11px] font-medium transition shadow-2xs"
              title="Carregar tudo e ir para a última linha da tabela">
              <i data-lucide="arrow-down" class="w-3.5 h-3.5"></i>
              <span>Fim ⤓</span>
            </button>

            <button 
              @click="scrollToReplanTop()" 
              class="flex items-center space-x-1 px-2 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-300 rounded text-[11px] font-medium transition shadow-2xs"
              title="Voltar ao topo da tabela">
              <i data-lucide="arrow-up" class="w-3.5 h-3.5"></i>
              <span>Topo ⤒</span>
            </button>
          </div>
        </div>

        <!-- Active Month Filter Banner -->
        <div x-show="selectedFilterMonths.length > 0" class="mx-3 my-2 flex items-center justify-between bg-blue-50 border border-blue-200 rounded-lg px-3 py-1.5 text-xs text-blue-900">
          <div class="flex items-center space-x-2">
            <i data-lucide="filter" class="w-3.5 h-3.5 text-blue-600 shrink-0"></i>
            <span>Filtrando por mês(es): <strong class="font-bold text-blue-800" x-text="getMonthFilterLabel()"></strong> (<span x-text="filteredReplanRows.length"></span> linhas ativas)</span>
          </div>
          <button @click="clearMonthFilter()" class="flex items-center space-x-1 text-[11px] font-bold text-blue-700 hover:text-blue-900 bg-white border border-blue-300 rounded px-2 py-0.5 transition hover:bg-blue-100/60 shadow-2xs">
            <span>Limpar Filtro</span>
            <i data-lucide="x" class="w-3 h-3"></i>
          </button>
        </div>

        <div x-ref="replanContainer" class="overflow-x-auto max-h-[600px] 2xl:max-h-[750px] scrollbar-thin">
          <table class="w-full text-left table-compact border-separate border-spacing-0">
            <thead class="bg-slate-900 text-white sticky top-0 z-20">
              <!-- Row 1: Column Titles -->
              <tr class="h-[42px]">
                <th class="py-1 px-2 w-10 min-w-[40px] max-w-[40px] text-center border-b border-r border-slate-800 sticky top-0 left-0 z-40 bg-slate-900 h-[42px] box-border">Nív</th>
                <th class="py-1 px-2 w-28 min-w-[110px] max-w-[110px] border-b border-r border-slate-800 sticky top-0 left-[40px] z-40 bg-slate-900 h-[42px] box-border">Código</th>
                <th class="py-1 px-3 w-[280px] min-w-[280px] max-w-[280px] border-b border-r border-slate-800 sticky top-0 left-[150px] z-40 bg-slate-900 h-[42px] box-border">Descrição / Tarefa Futura</th>
                <th class="py-1 px-2 w-24 min-w-[96px] max-w-[96px] text-right border-b border-r border-slate-800 sticky top-0 left-[430px] z-40 bg-slate-900 h-[42px] box-border">Orçado</th>
                <th class="py-1 px-2 w-20 min-w-[80px] max-w-[80px] text-right border-b border-r border-slate-800 text-emerald-400 sticky top-0 left-[526px] z-40 bg-slate-900 h-[42px] box-border">Realiz.</th>
                <th class="py-1 px-2 w-28 min-w-[110px] max-w-[110px] text-right border-b border-r border-slate-800 text-blue-300 sticky top-0 left-[606px] z-40 bg-slate-900 sticky-shadow-header-r h-[42px] box-border" x-text="replanSaldoInPct ? 'Saldo (%)' : 'Saldo (R$)'"></th>
                
                <template x-for="c in replanResult?.cycles" :key="c.num">
                  <th 
                    @click="toggleMonthFilter(c.num)" 
                    :class="isMonthFilterActive(c.num) ? 'bg-blue-600 text-white ring-2 ring-blue-300 font-extrabold cursor-pointer' : (c.num <= cutoffMedNum ? 'bg-slate-900 text-emerald-400 hover:bg-slate-800 cursor-pointer' : 'bg-indigo-950 text-indigo-200 hover:bg-indigo-900 cursor-pointer')"
                    :title="'Clique para filtrar atividades com valor em ' + (c.period_label || c.name)"
                    class="py-1 px-2 text-right min-w-[85px] border-b border-r border-slate-800 leading-tight transition-colors select-none group sticky top-0 z-30 bg-slate-900 h-[42px] box-border">
                    <div class="flex items-center justify-end space-x-1">
                      <i data-lucide="filter" x-show="isMonthFilterActive(c.num)" class="w-2.5 h-2.5 text-amber-300 shrink-0"></i>
                      <span class="block font-bold text-[11px]" x-text="c.name"></span>
                    </div>
                    <span class="block text-[9px] font-normal opacity-80" :class="isMonthFilterActive(c.num) ? 'text-blue-100' : ''" x-text="c.period_label"></span>
                  </th>
                </template>
                <th class="py-1 px-2 text-right min-w-[95px] bg-slate-800 border-b border-slate-800 sticky top-0 z-30 h-[42px] box-border" x-text="ffRepViewMode === 'val' ? 'Total (R$)' : 'Total (%)'"></th>
              </tr>
              <!-- Row 2: Level 1 Totalizer (Pinned) -->
              <tr class="h-8 bg-black">
                <th class="py-0.5 px-2 text-center border-b border-r border-neutral-800 sticky top-[42px] left-0 z-35 bg-black text-white w-10 min-w-[40px] max-w-[40px] font-bold h-8 box-border">1</th>
                <th class="py-0.5 px-2 font-mono text-[10px] border-b border-r border-neutral-800 sticky top-[42px] left-[40px] z-35 bg-black text-white w-28 min-w-[110px] max-w-[110px] font-bold h-8 box-border text-left" x-text="level1ReplanRow?.code || '1'"></th>
                <th class="py-0.5 px-3 border-b border-r border-neutral-800 sticky top-[42px] left-[150px] z-35 bg-black text-white w-[280px] min-w-[280px] max-w-[280px] font-bold h-8 box-border text-left">
                  <div class="truncate" x-text="level1ReplanRow?.description || 'Platea 19 / Total Geral da Obra'"></div>
                </th>
                <th class="py-0.5 px-2 text-right border-b border-r border-neutral-800 sticky top-[42px] left-[430px] z-35 bg-black text-white w-24 min-w-[96px] max-w-[96px] font-bold h-8 box-border" x-text="formatCurrency(level1ReplanRow?.budget || replanResult?.total_budget)"></th>
                <th class="py-0.5 px-2 text-right border-b border-r border-neutral-800 sticky top-[42px] left-[526px] z-35 bg-black text-emerald-400 w-20 min-w-[80px] max-w-[80px] font-bold h-8 box-border" x-text="(replanResult?.total_measured_pct || 0).toFixed(2) + '%'"></th>
                <th class="py-0.5 px-2 text-right border-b border-r border-neutral-800 sticky top-[42px] left-[606px] z-35 bg-black text-blue-300 sticky-shadow-header-r w-28 min-w-[110px] max-w-[110px] font-bold h-8 box-border" x-text="getReplanLevel1Saldo()"></th>
                <template x-for="c in replanResult?.cycles" :key="c.num">
                  <th class="py-0.5 px-2 text-right min-w-[85px] border-b border-r border-neutral-800 sticky top-[42px] z-25 bg-black text-white font-bold h-8 box-border">
                    <span class="text-[10px] font-bold" :class="c.num <= cutoffMedNum ? 'text-emerald-300' : 'text-indigo-200'" x-text="getReplanLevel1CycleValue(c.num)"></span>
                  </th>
                </template>
                <th class="py-0.5 px-2 text-right min-w-[95px] border-b border-neutral-800 sticky top-[42px] z-25 bg-neutral-900 text-white font-bold h-8 box-border" x-text="getReplanLevel1Total()"></th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-200">
              <template x-for="row in paginatedReplanRows" :key="row.code">
                <tr class="group" :class="row.level === 6 ? 'row-level-6' : getLevelRowClass(row.level)">
                  <td class="py-0.5 px-2 text-center border-b border-r sticky left-0 z-10 w-10 min-w-[40px] max-w-[40px]" 
                      :class="row.level === 6 ? 'sticky-level-6 font-bold text-indigo-600' : getLevelStickyClass(row.level)" 
                      x-text="row.level"></td>
                  <td class="py-0.5 px-2 font-mono text-[10px] border-b border-r sticky left-[40px] z-10 w-28 min-w-[110px] max-w-[110px]" 
                      :class="row.level === 6 ? 'sticky-level-6 text-slate-400 text-[9px]' : getLevelStickyClass(row.level)" 
                      x-text="row.code"></td>
                  <td class="py-0.5 px-3 border-b border-r sticky left-[150px] z-10 w-[280px] min-w-[280px] max-w-[280px]" 
                      :class="row.level === 6 ? 'sticky-level-6' : getLevelStickyClass(row.level)" 
                      :style="'padding-left: ' + (row.level === 6 ? '32px' : ((row.level-1)*12 + 8) + 'px')">
                    <div class="truncate flex items-center justify-between" 
                         :class="row.level === 6 ? 'cursor-pointer hover:text-indigo-600 transition-colors group/task' : ''"
                         @click="row.level === 6 && openTaskDrawerFromRow(row)"
                         :title="row.level === 6 ? 'Clique para editar as datas e duração da atividade \'' + row.description + '\' no Cronograma' : row.description">
                      <div class="truncate flex items-center">
                        <span x-show="row.level === 6" class="text-indigo-500 mr-1 font-bold shrink-0">↳</span>
                        <span class="truncate" :class="row.level === 6 ? 'group-hover/task:underline font-medium' : ''" x-text="row.description"></span>
                        <i x-show="row.level === 6" data-lucide="edit-2" class="w-2.5 h-2.5 ml-1.5 opacity-0 group-hover/task:opacity-100 text-indigo-500 transition-opacity shrink-0"></i>
                      </div>
                      <!-- Link Button for Level 5 -->
                      <button 
                        x-show="row.level === 5" 
                        @click.stop="openLinkModal(row.code, -1)" 
                        class="text-indigo-600 hover:text-indigo-800 p-0.5 rounded hover:bg-indigo-100 transition opacity-0 group-hover:opacity-100 shrink-0 ml-1" 
                        title="Vincular / revisar atividades do cronograma para este serviço">
                        <i data-lucide="link" class="w-3 h-3"></i>
                      </button>
                    </div>
                  </td>
                  <td class="py-0.5 px-2 text-right border-b border-r font-semibold sticky left-[430px] z-10 w-24 min-w-[96px] max-w-[96px]" 
                      :class="row.level === 6 ? 'sticky-level-6 text-slate-400' : getLevelStickyClass(row.level)" 
                      x-text="row.level === 6 ? '-' : formatCurrency(row.budget)"></td>
                  <td class="py-0.5 px-2 text-right border-b border-r font-semibold sticky left-[526px] z-10 w-20 min-w-[80px] max-w-[80px]" 
                      :class="row.level === 6 ? 'sticky-level-6 text-amber-700 text-[10px]' : (getLevelStickyClass(row.level) + (row.level <= 3 ? ' text-emerald-300' : ' text-emerald-700'))" 
                      x-text="row.level === 6 ? (row.future_weight_pct ? row.future_weight_pct.toFixed(1) + '%' : '-') : (row.med_pct !== undefined ? row.med_pct.toFixed(2) + '%' : (row.measured_pct ? row.measured_pct.toFixed(2) + '%' : '-'))"></td>
                  <td class="py-0.5 px-2 text-right border-b border-r font-bold sticky left-[606px] z-10 w-28 min-w-[110px] max-w-[110px] sticky-shadow-r" 
                      :class="[
                        row.level === 6 ? 'sticky-level-6 text-blue-700' : (getLevelStickyClass(row.level) + (row.level <= 3 ? ' text-blue-200' : ' text-blue-700')),
                        row.level === 5 ? 'cursor-pointer hover:text-indigo-700 hover:bg-indigo-50/80 transition-colors group/l5saldo' : ''
                      ]"
                      @click="row.level === 5 && openReplanWeightModal(row)"
                      :title="row.level === 5 ? 'Clique para redistribuir o saldo entre as atividades filhas' : ''">
                    <div class="flex items-center justify-end space-x-1">
                      <span x-show="row.level === 5 && row.has_custom_replan_weights" 
                            title="Distribuição personalizada de saldo ativa" 
                            class="inline-block w-1.5 h-1.5 rounded-full bg-indigo-500 shrink-0"></span>
                      <span x-text="getReplanSaldoValue(row)"></span>
                      <i x-show="row.level === 5" data-lucide="sliders-horizontal" class="w-2.5 h-2.5 text-indigo-500 opacity-0 group-hover/l5saldo:opacity-100 transition-opacity shrink-0"></i>
                    </div>
                  </td>

                  <template x-for="c in replanResult?.cycles" :key="c.num">
                    <td 
                      class="py-0.5 px-2 text-right border-b border-r transition-colors" 
                      :class="row.level === 6 && hasReplanCycleVal(row, c.num) ? 'cell-l6-has-val' : (c.num <= cutoffMedNum ? 'bg-emerald-50/30 text-emerald-800 font-semibold' : '')"
                      x-text="getReplanCellValue(row, c.num)">
                    </td>
                  </template>
                  <td class="py-0.5 px-2 text-right font-bold border-b border-r" :class="row.level <= 3 ? 'text-blue-200' : 'text-slate-900'" x-text="getReplanCellTotal(row)"></td>
                </tr>
              </template>
            </tbody>
          </table>
          <!-- Rolagem infinita: o marcador carrega mais linhas quando fica visível -->
          <div x-init="observeMore($el, 'replanPage', () => filteredReplanRows.length)" class="h-1"></div>
        </div>

        <div class="p-2 border-t border-slate-200 text-xs text-slate-600 bg-slate-50 flex flex-wrap items-center justify-between gap-2">
          <div class="flex items-center space-x-3">
            <div>
              Mostrando <span class="font-bold text-slate-900" x-text="Math.min(replanPage * replanPageSize, filteredReplanRows.length)"></span> de
              <span class="font-bold text-slate-900" x-text="filteredReplanRows.length"></span> linhas
            </div>

            <!-- Page Size Selector -->
            <div class="flex items-center space-x-1 bg-slate-200/80 p-0.5 rounded text-[11px]">
              <span class="text-slate-500 px-1 text-[10px] uppercase font-semibold">Exibir:</span>
              <button 
                @click="setReplanPageSize(150)" 
                :class="replanPageSize === 150 ? 'bg-white font-bold text-indigo-700 shadow-2xs' : 'text-slate-600 hover:text-slate-900'"
                class="px-1.5 py-0.5 rounded transition">150</button>
              <button 
                @click="setReplanPageSize(300)" 
                :class="replanPageSize === 300 ? 'bg-white font-bold text-indigo-700 shadow-2xs' : 'text-slate-600 hover:text-slate-900'"
                class="px-1.5 py-0.5 rounded transition">300</button>
              <button 
                @click="setReplanPageSize(600)" 
                :class="replanPageSize === 600 ? 'bg-white font-bold text-indigo-700 shadow-2xs' : 'text-slate-600 hover:text-slate-900'"
                class="px-1.5 py-0.5 rounded transition">600</button>
              <button 
                @click="setReplanPageSize('all')" 
                :class="replanPageSize >= filteredReplanRows.length ? 'bg-white font-bold text-indigo-700 shadow-2xs' : 'text-slate-600 hover:text-slate-900'"
                class="px-1.5 py-0.5 rounded transition">Todas (<span x-text="filteredReplanRows.length"></span>)</button>
            </div>
          </div>

          <div class="flex items-center space-x-2">
            <button 
              x-show="replanPage * replanPageSize < filteredReplanRows.length" 
              @click="loadMoreReplanRows()"
              class="px-2.5 py-1 bg-white hover:bg-slate-100 text-slate-700 border border-slate-300 rounded font-medium shadow-2xs transition flex items-center space-x-1">
              <span>+ Carregar mais <span x-text="Math.min(replanPageSize, filteredReplanRows.length - replanPage * replanPageSize)"></span> linhas</span>
            </button>

            <button 
              x-show="replanPage * replanPageSize < filteredReplanRows.length" 
              @click="loadAllReplanRows()"
              class="px-2.5 py-1 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 rounded font-medium shadow-2xs transition flex items-center space-x-1">
              <i data-lucide="chevrons-down" class="w-3.5 h-3.5"></i>
              <span>Carregar Todas</span>
            </button>

            <button 
              @click="scrollToReplanBottom()"
              class="px-2.5 py-1 bg-white hover:bg-slate-100 text-slate-700 border border-slate-300 rounded font-medium shadow-2xs transition flex items-center space-x-1"
              title="Carrega todas as linhas e vai até o final">
              <span>Última Linha ⤓</span>
            </button>

            <button 
              @click="scrollToReplanTop()"
              class="px-2.5 py-1 bg-white hover:bg-slate-100 text-slate-700 border border-slate-300 rounded font-medium shadow-2xs transition flex items-center space-x-1"
              title="Voltar ao topo">
              <span>Topo ⤒</span>
            </button>
          </div>
        </div>
      </div>
    </template>
