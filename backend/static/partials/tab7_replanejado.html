    <!-- TAB 7: REPLANEJADO (SALDO NÍVEL 6 COM SELETOR DE CORTE E VERSÃO) -->
    <template x-if="activeTab === 'replanejado'">
      <div class="bg-white rounded-xl shadow-xs border border-slate-200 overflow-hidden">
        <div class="p-3 border-b border-slate-200 flex flex-wrap items-center justify-between gap-3">
          <div>
            <h3 class="font-bold text-slate-900 text-xs">Replanejado (Distribuição do Saldo a Nível 6)</h3>
            <p class="text-[10px] text-slate-500">Saldo restante redistribuído a partir do mês selecionado com a versão do cronograma ativa</p>
          </div>

          <div class="flex flex-wrap items-center gap-2">
            <!-- Recalculate From Month Selector -->
            <div class="flex items-center space-x-1.5 bg-slate-50 border border-slate-200 px-2.5 py-1 rounded">
              <span class="text-[11px] font-semibold text-slate-600">Recalcular a partir de:</span>
              <select 
                x-model.number="cutoffMedNum" 
                @change="runSimulation()"
                class="bg-white border border-slate-300 text-slate-800 text-xs font-semibold rounded px-1.5 py-0.5 outline-none">
                <template x-for="i in 36" :key="i">
                  <option :value="i" x-text="'Medição ' + i"></option>
                </template>
              </select>
            </div>

            <!-- Schedule Version Selector -->
            <div class="flex items-center space-x-1 text-xs">
              <span class="text-slate-500 font-semibold">Cronograma:</span>
              <select 
                x-model="selectedVersionId" 
                @change="runSimulation()"
                class="bg-slate-50 border border-slate-300 text-slate-800 rounded px-2 py-1 text-xs font-semibold outline-none">
                <template x-for="v in replanResult?.tab_cronograma?.versions" :key="v.id">
                  <option :value="v.id" x-text="v.name"></option>
                </template>
              </select>
            </div>

            <!-- Level Filter Selector -->
            <div class="flex items-center bg-slate-100 p-0.5 rounded-lg border border-slate-200 text-[11px] font-semibold">
              <button 
                @click="levelFilterReplan = 2; replanPage = 1;" 
                :class="levelFilterReplan === 2 ? 'bg-indigo-600 text-white shadow-xs' : 'text-slate-600 hover:text-slate-900'" 
                class="px-2 py-0.5 rounded transition">
                Até N2
              </button>
              <button 
                @click="levelFilterReplan = 3; replanPage = 1;" 
                :class="levelFilterReplan === 3 ? 'bg-indigo-600 text-white shadow-xs' : 'text-slate-600 hover:text-slate-900'" 
                class="px-2 py-0.5 rounded transition">
                Até N3
              </button>
              <button 
                @click="levelFilterReplan = 4; replanPage = 1;" 
                :class="levelFilterReplan === 4 ? 'bg-indigo-600 text-white shadow-xs' : 'text-slate-600 hover:text-slate-900'" 
                class="px-2 py-0.5 rounded transition">
                Até N4
              </button>
              <button 
                @click="levelFilterReplan = 5; replanPage = 1;" 
                :class="levelFilterReplan === 5 ? 'bg-indigo-600 text-white shadow-xs' : 'text-slate-600 hover:text-slate-900'" 
                class="px-2 py-0.5 rounded transition">
                Até N5
              </button>
              <button 
                @click="levelFilterReplan = 0; replanPage = 1;" 
                :class="levelFilterReplan === 0 ? 'bg-indigo-600 text-white shadow-xs' : 'text-slate-600 hover:text-slate-900'" 
                class="px-2 py-0.5 rounded transition">
                Todos (N5+N6)
              </button>
            </div>

            <!-- View Mode Toggle (% / R$) -->
            <div class="flex items-center bg-slate-100 p-0.5 rounded-lg border border-slate-200 text-[11px] font-semibold">
              <button 
                @click="ffRepViewMode = 'pct'" 
                :class="ffRepViewMode === 'pct' ? 'bg-white text-indigo-700 shadow-xs' : 'text-slate-600 hover:text-slate-900'"
                class="px-2.5 py-0.5 rounded transition">
                % Obra
              </button>
              <button 
                @click="ffRepViewMode = 'val'" 
                :class="ffRepViewMode === 'val' ? 'bg-white text-indigo-700 shadow-xs' : 'text-slate-600 hover:text-slate-900'"
                class="px-2.5 py-0.5 rounded transition">
                R$ Financeiro
              </button>
            </div>

            <input 
              type="text" 
              x-model="searchReplan" 
              @input="replanPage = 1"
              placeholder="Filtrar replanejado..." 
              class="bg-slate-50 border border-slate-300 rounded px-2 py-1 text-xs w-36 outline-none">
          </div>
        </div>

        <!-- Active Month Filter Banner -->
        <div x-show="selectedFilterMonths.length > 0" class="mx-3 my-2 flex items-center justify-between bg-blue-50 border border-blue-200 rounded-lg px-3 py-1.5 text-xs text-blue-900">
          <div class="flex items-center space-x-2">
            <i data-lucide="filter" class="w-3.5 h-3.5 text-blue-600 shrink-0"></i>
            <span>Filtrando por mês(es): <strong class="font-bold text-blue-800" x-text="getMonthFilterLabel()"></strong> (<span x-text="filteredReplanRows.length"></span> linhas ativas)</span>
          </div>
          <button @click="clearMonthFilter()" class="flex items-center space-x-1 text-[11px] font-bold text-blue-700 hover:text-blue-900 bg-white border border-blue-300 rounded px-2 py-0.5 transition hover:bg-blue-100/60 shadow-2xs">
            <span>Limpar Filtro</span>
            <i data-lucide="x" class="w-3 h-3"></i>
          </button>
        </div>

        <div class="overflow-x-auto max-h-[600px] 2xl:max-h-[750px] scrollbar-thin">
          <table class="w-full text-left table-compact border-separate border-spacing-0">
            <thead class="bg-slate-900 text-white sticky top-0 z-20">
              <!-- Row 1: Column Titles -->
              <tr class="h-[34px]">
                <th class="py-1 px-2 w-10 min-w-[40px] max-w-[40px] text-center border-b border-r border-slate-800 sticky top-0 left-0 z-40 bg-slate-900 h-[34px] box-border">Nív</th>
                <th class="py-1 px-2 w-28 min-w-[110px] max-w-[110px] border-b border-r border-slate-800 sticky top-0 left-[40px] z-40 bg-slate-900 h-[34px] box-border">Código</th>
                <th class="py-1 px-3 w-[280px] min-w-[280px] max-w-[280px] border-b border-r border-slate-800 sticky top-0 left-[150px] z-40 bg-slate-900 h-[34px] box-border">Descrição / Tarefa Futura</th>
                <th class="py-1 px-2 w-24 min-w-[96px] max-w-[96px] text-right border-b border-r border-slate-800 sticky top-0 left-[430px] z-40 bg-slate-900 h-[34px] box-border">Orçado</th>
                <th class="py-1 px-2 w-20 min-w-[80px] max-w-[80px] text-right border-b border-r border-slate-800 text-emerald-400 sticky top-0 left-[526px] z-40 bg-slate-900 h-[34px] box-border">Realiz.</th>
                <th class="py-1 px-2 w-28 min-w-[110px] max-w-[110px] text-right border-b border-r border-slate-800 text-blue-300 sticky top-0 left-[606px] z-40 bg-slate-900 sticky-shadow-header-r h-[34px] box-border">Saldo</th>
                
                <template x-for="c in replanResult?.cycles" :key="c.num">
                  <th 
                    @click="toggleMonthFilter(c.num)" 
                    :class="isMonthFilterActive(c.num) ? 'bg-blue-600 text-white ring-2 ring-blue-300 font-extrabold cursor-pointer' : (c.num <= cutoffMedNum ? 'bg-slate-900 text-emerald-400 hover:bg-slate-800 cursor-pointer' : 'bg-indigo-950 text-indigo-200 hover:bg-indigo-900 cursor-pointer')"
                    :title="'Clique para filtrar atividades com valor em ' + (c.period_label || c.name)"
                    class="py-1 px-2 text-right min-w-[85px] border-b border-r border-slate-800 leading-tight transition-colors select-none group sticky top-0 z-30 bg-slate-900 h-[34px] box-border">
                    <div class="flex items-center justify-end space-x-1">
                      <i data-lucide="filter" x-show="isMonthFilterActive(c.num)" class="w-2.5 h-2.5 text-amber-300 shrink-0"></i>
                      <span class="block font-bold text-[11px]" x-text="c.name"></span>
                    </div>
                    <span class="block text-[9px] font-normal opacity-80" :class="isMonthFilterActive(c.num) ? 'text-blue-100' : ''" x-text="c.period_label"></span>
                  </th>
                </template>
                <th class="py-1 px-2 text-right min-w-[95px] bg-slate-800 border-b border-slate-800 sticky top-0 z-30 h-[34px] box-border">Total</th>
              </tr>
              <!-- Row 2: Level 1 Totalizer (Pinned) -->
              <tr class="h-8">
                <th class="py-0.5 px-2 text-center border-b border-r border-neutral-800 sticky top-[34px] left-0 z-35 sticky-level-1 w-10 min-w-[40px] max-w-[40px] font-bold h-8 box-border">1</th>
                <th class="py-0.5 px-2 font-mono text-[10px] border-b border-r border-neutral-800 sticky top-[34px] left-[40px] z-35 sticky-level-1 w-28 min-w-[110px] max-w-[110px] font-bold h-8 box-border text-left" x-text="level1ReplanRow?.code || '1'"></th>
                <th class="py-0.5 px-3 border-b border-r border-neutral-800 sticky top-[34px] left-[150px] z-35 sticky-level-1 w-[280px] min-w-[280px] max-w-[280px] font-bold h-8 box-border text-left">
                  <div class="truncate" x-text="level1ReplanRow?.description || 'Platea 19 / Total Geral da Obra'"></div>
                </th>
                <th class="py-0.5 px-2 text-right border-b border-r border-neutral-800 sticky top-[34px] left-[430px] z-35 sticky-level-1 w-24 min-w-[96px] max-w-[96px] font-bold h-8 box-border" x-text="formatCurrency(level1ReplanRow?.budget || replanResult?.total_budget)"></th>
                <th class="py-0.5 px-2 text-right border-b border-r border-neutral-800 sticky top-[34px] left-[526px] z-35 sticky-level-1 w-20 min-w-[80px] max-w-[80px] font-bold text-emerald-400 h-8 box-border" x-text="(replanResult?.total_measured_pct || 0).toFixed(2) + '%'"></th>
                <th class="py-0.5 px-2 text-right border-b border-r border-neutral-800 sticky top-[34px] left-[606px] z-35 sticky-level-1 w-28 min-w-[110px] max-w-[110px] font-bold text-blue-300 sticky-shadow-header-r h-8 box-border" x-text="formatCurrency(level1ReplanRow?.saldo || replanResult?.total_balance)"></th>
                <template x-for="c in replanResult?.cycles" :key="c.num">
                  <th class="py-0.5 px-2 text-right min-w-[85px] border-b border-r border-neutral-800 sticky top-[34px] z-25 bg-black text-white font-bold h-8 box-border">
                    <span class="text-[10px] font-bold" :class="c.num <= cutoffMedNum ? 'text-emerald-300' : 'text-indigo-200'" x-text="ffRepViewMode === 'pct' ? (((level1ReplanRow?.cycle_vals?.[String(c.num)] || 0) / replanResult?.total_budget) * 100 > 0 ? (((level1ReplanRow?.cycle_vals?.[String(c.num)] || 0) / replanResult?.total_budget) * 100).toFixed(2) + '%' : '-') : formatCurrency(level1ReplanRow?.cycle_vals?.[String(c.num)])"></span>
                  </th>
                </template>
                <th class="py-0.5 px-2 text-right min-w-[95px] border-b border-neutral-800 sticky top-[34px] z-25 bg-neutral-900 text-white font-bold h-8 box-border" x-text="formatCurrency(level1ReplanRow?.total || replanResult?.total_budget)"></th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-200">
              <template x-for="row in paginatedReplanRows" :key="row.code">
                <tr class="group" :class="row.level === 6 ? 'row-level-6' : getLevelRowClass(row.level)">
                  <td class="py-0.5 px-2 text-center border-b border-r sticky left-0 z-10 w-10 min-w-[40px] max-w-[40px]" 
                      :class="row.level === 6 ? 'sticky-level-6 font-bold text-indigo-600' : getLevelStickyClass(row.level)" 
                      x-text="row.level"></td>
                  <td class="py-0.5 px-2 font-mono text-[10px] border-b border-r sticky left-[40px] z-10 w-28 min-w-[110px] max-w-[110px]" 
                      :class="row.level === 6 ? 'sticky-level-6 text-slate-400 text-[9px]' : getLevelStickyClass(row.level)" 
                      x-text="row.code"></td>
                  <td class="py-0.5 px-3 border-b border-r sticky left-[150px] z-10 w-[280px] min-w-[280px] max-w-[280px]" 
                      :class="row.level === 6 ? 'sticky-level-6' : getLevelStickyClass(row.level)" 
                      :style="'padding-left: ' + (row.level === 6 ? '32px' : ((row.level-1)*12 + 8) + 'px')">
                    <div class="truncate" :title="row.description">
                      <span x-show="row.level === 6" class="text-indigo-500 mr-1 font-bold">↳</span>
                      <span x-text="row.description"></span>
                    </div>
                  </td>
                  <td class="py-0.5 px-2 text-right border-b border-r font-semibold sticky left-[430px] z-10 w-24 min-w-[96px] max-w-[96px]" 
                      :class="row.level === 6 ? 'sticky-level-6 text-slate-400' : getLevelStickyClass(row.level)" 
                      x-text="row.level === 6 ? '-' : formatCurrency(row.budget)"></td>
                  <td class="py-0.5 px-2 text-right border-b border-r font-semibold sticky left-[526px] z-10 w-20 min-w-[80px] max-w-[80px]" 
                      :class="row.level === 6 ? 'sticky-level-6 text-amber-700 text-[10px]' : [getLevelStickyClass(row.level), row.level <= 3 ? 'text-emerald-300' : 'text-emerald-700']" 
                      x-text="row.level === 6 ? (row.future_weight_pct ? row.future_weight_pct.toFixed(1) + '%' : '-') : (row.med_pct !== undefined ? row.med_pct.toFixed(2) + '%' : (row.measured_pct ? row.measured_pct.toFixed(2) + '%' : '-'))"></td>
                  <td class="py-0.5 px-2 text-right border-b border-r font-bold sticky left-[606px] z-10 w-28 min-w-[110px] max-w-[110px] sticky-shadow-r" 
                      :class="row.level === 6 ? 'sticky-level-6 text-blue-700' : [getLevelStickyClass(row.level), row.level <= 3 ? 'text-blue-200' : 'text-blue-700']" 
                      x-text="formatCurrency(row.level === 6 ? row.allocated_saldo : row.saldo)"></td>

                  <template x-for="c in replanResult?.cycles" :key="c.num">
                    <td 
                      class="py-0.5 px-2 text-right border-b border-r transition-colors" 
                      :class="row.level === 6 && hasReplanCycleVal(row, c.num) ? 'cell-l6-has-val' : (c.num <= cutoffMedNum ? 'bg-emerald-50/30 text-emerald-800 font-semibold' : '')"
                      x-text="ffRepViewMode === 'pct' ? (((row.cycle_vals[String(c.num)] || 0) / replanResult?.total_budget) * 100 > 0 ? (((row.cycle_vals[String(c.num)] || 0) / replanResult?.total_budget) * 100).toFixed(2) + '%' : '-') : formatCurrency(row.cycle_vals[String(c.num)])">
                    </td>
                  </template>
                  <td class="py-0.5 px-2 text-right font-bold border-b border-r" :class="row.level <= 3 ? 'text-blue-200' : 'text-slate-900'" x-text="formatCurrency(row.total)"></td>
                </tr>
              </template>
            </tbody>
          </table>
          <!-- Rolagem infinita: o marcador carrega mais linhas quando fica visível -->
          <div x-init="observeMore($el, 'replanPage', () => filteredReplanRows.length)" class="h-1"></div>
        </div>

        <div class="p-2 border-t border-slate-200 text-xs text-slate-600 bg-slate-50">
          Mostrando <span class="font-bold" x-text="Math.min(replanPage * replanPageSize, filteredReplanRows.length)"></span> de
          <span class="font-bold" x-text="filteredReplanRows.length"></span> linhas
          <span x-show="replanPage * replanPageSize < filteredReplanRows.length" class="text-slate-400">· role para carregar mais</span>
        </div>
      </div>
    </template>
