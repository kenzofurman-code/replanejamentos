    <!-- TAB 10: CURVA FINANCEIRA (DESEMBOLSO EFETIVO & FLUXO DE CAIXA) -->
    <template x-if="activeTab === 'financeiro'">
      <div class="space-y-4">
        
        <!-- Top Toolbar & Controls -->
        <div class="bg-white rounded-xl shadow-xs border border-slate-200 p-3 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
          <div>
            <div class="flex items-center space-x-2">
              <h3 class="font-bold text-slate-900 text-xs">Curva Financeira (Desembolso Efetivo & Fluxo de Caixa)</h3>
              <span class="text-[10px] px-2 py-0.5 bg-emerald-100 text-emerald-800 rounded-full font-bold">Fluxo de Caixa</span>
            </div>
            <p class="text-[10px] text-slate-500">Mão de obra paga no dia 05 do mês subsequente (+1 ciclo) + Material com prazos de faturamento (padrão 28d ou parcelado)</p>
          </div>

          <div class="flex flex-wrap items-center gap-2">
            <!-- Botão de Configuração de Prazos e Insumos -->
            <button 
              @click="openConfigCurvasModal()" 
              class="flex items-center space-x-1.5 bg-slate-800 hover:bg-slate-700 text-white text-xs font-semibold px-2.5 py-1.5 rounded-lg border border-slate-700 transition shadow-xs">
              <i data-lucide="sliders" class="w-3.5 h-3.5 text-emerald-400"></i>
              <span>Configurar Prazos & Insumos</span>
            </button>

            <!-- Level Filter Quick Buttons -->
            <div class="flex items-center space-x-1 bg-slate-100 p-0.5 rounded-lg border border-slate-200 text-[11px] font-semibold">
              <span class="text-[10px] text-slate-400 px-1 uppercase font-bold">Nível:</span>
              <button 
                @click="levelFilterFin = 2" 
                :class="levelFilterFin === 2 ? 'bg-emerald-600 text-white shadow-xs' : 'text-slate-600 hover:text-slate-900'"
                class="px-2 py-0.5 rounded transition">
                Até N2
              </button>
              <button 
                @click="levelFilterFin = 3" 
                :class="levelFilterFin === 3 ? 'bg-emerald-600 text-white shadow-xs' : 'text-slate-600 hover:text-slate-900'"
                class="px-2 py-0.5 rounded transition">
                Até N3 (Padrão)
              </button>
              <button 
                @click="levelFilterFin = 4" 
                :class="levelFilterFin === 4 ? 'bg-emerald-600 text-white shadow-xs' : 'text-slate-600 hover:text-slate-900'"
                class="px-2 py-0.5 rounded transition">
                Até N4
              </button>
              <button 
                @click="levelFilterFin = 0" 
                :class="levelFilterFin === 0 ? 'bg-emerald-600 text-white shadow-xs' : 'text-slate-600 hover:text-slate-900'"
                class="px-2 py-0.5 rounded transition">
                Todos
              </button>
            </div>

            <!-- View Mode Switcher -->
            <div class="flex items-center bg-slate-100 p-0.5 rounded-lg border border-slate-200 text-[11px] font-semibold">
              <button 
                @click="finViewMode = 'val'" 
                :class="finViewMode === 'val' ? 'bg-white text-emerald-700 shadow-xs' : 'text-slate-600 hover:text-slate-900'"
                class="px-2 py-0.5 rounded transition">
                R$ Total
              </button>
              <button 
                @click="finViewMode = 'mat'" 
                :class="finViewMode === 'mat' ? 'bg-white text-emerald-700 shadow-xs' : 'text-slate-600 hover:text-slate-900'"
                class="px-2 py-0.5 rounded transition">
                R$ Material
              </button>
              <button 
                @click="finViewMode = 'mo'" 
                :class="finViewMode === 'mo' ? 'bg-white text-emerald-700 shadow-xs' : 'text-slate-600 hover:text-slate-900'"
                class="px-2 py-0.5 rounded transition">
                R$ M.O.
              </button>
              <button 
                @click="finViewMode = 'pct'" 
                :class="finViewMode === 'pct' ? 'bg-white text-emerald-700 shadow-xs' : 'text-slate-600 hover:text-slate-900'"
                class="px-2 py-0.5 rounded transition">
                % Obra
              </button>
            </div>
          </div>
        </div>

        <!-- KPI Cards & Chart -->
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-4">
          <!-- KPI Cards -->
          <div class="space-y-3">
            <div class="bg-white rounded-xl p-3 border border-slate-200 shadow-xs">
              <span class="text-[10px] uppercase font-bold text-slate-400">Orçamento Fechado</span>
              <div class="text-base font-extrabold text-slate-800 mt-0.5" x-text="formatCurrency(replanResult?.total_budget)"></div>
              <div class="text-[10px] text-slate-500 mt-0.5">Base EAP</div>
            </div>
            <div class="bg-white rounded-xl p-3 border border-slate-200 shadow-xs">
              <span class="text-[10px] uppercase font-bold text-emerald-600">Total Desembolso Projetado</span>
              <div class="text-base font-extrabold text-emerald-700 mt-0.5" x-text="formatCurrency(level1FinRow?.total)"></div>
              <div class="text-[10px] text-emerald-600 mt-0.5">Saída de caixa 100%</div>
            </div>
            <div class="bg-white rounded-xl p-3 border border-slate-200 shadow-xs">
              <span class="text-[10px] uppercase font-bold text-amber-600">Material Desembolsado</span>
              <div class="text-base font-extrabold text-amber-700 mt-0.5" x-text="formatCurrency(level1FinRow?.total_mat)"></div>
              <div class="text-[10px] text-amber-600 mt-0.5" x-text="level1FinRow?.total ? ((level1FinRow.total_mat / level1FinRow.total)*100).toFixed(1) + '% do caixa' : '-'"></div>
            </div>
            <div class="bg-white rounded-xl p-3 border border-slate-200 shadow-xs">
              <span class="text-[10px] uppercase font-bold text-blue-600">Mão de Obra Paga (Dia 05)</span>
              <div class="text-base font-extrabold text-blue-700 mt-0.5" x-text="formatCurrency(level1FinRow?.total_mo)"></div>
              <div class="text-[10px] text-blue-600 mt-0.5" x-text="level1FinRow?.total ? ((level1FinRow.total_mo / level1FinRow.total)*100).toFixed(1) + '% do caixa' : '-'"></div>
            </div>
          </div>

          <!-- Comparative S-Curves Chart (3 Curves) -->
          <div class="lg:col-span-3 bg-white rounded-xl p-3 border border-slate-200 shadow-xs flex flex-col justify-between">
            <div class="flex items-center justify-between pb-2 border-b border-slate-100 mb-2">
              <div>
                <h4 class="font-bold text-slate-800 text-xs">Comparativo das 3 Curvas (Produção Física × Competência NF × Desembolso Caixa)</h4>
                <p class="text-[10px] text-slate-400">Evidencia a defasagem temporal entre produção na obra, faturamento contábil e desembolso de caixa</p>
              </div>
              <div class="flex items-center space-x-3 text-[10px] font-semibold">
                <span class="flex items-center space-x-1"><span class="w-3 h-1 bg-indigo-500 rounded"></span><span>Físico Produzido</span></span>
                <span class="flex items-center space-x-1"><span class="w-3 h-1 bg-blue-500 rounded"></span><span>Competência (NF)</span></span>
                <span class="flex items-center space-x-1"><span class="w-3 h-1 bg-emerald-500 rounded"></span><span>Financeiro (Caixa)</span></span>
              </div>
            </div>
            <div class="h-48 w-full relative">
              <canvas id="chartComparisonCurves"></canvas>
            </div>
          </div>
        </div>

        <!-- Main EAP Table -->
        <div class="bg-white rounded-xl shadow-xs border border-slate-200 overflow-hidden">
          <div class="overflow-x-auto max-h-[600px] 2xl:max-h-[750px] scrollbar-thin">
            <table class="w-full text-left table-compact border-separate border-spacing-0">
              <thead class="bg-slate-900 text-white sticky top-0 z-20">
                <!-- Row 1: Titles -->
                <tr class="h-[34px]">
                  <th class="py-1 px-2 w-10 min-w-[40px] max-w-[40px] text-center border-b border-r border-slate-800 sticky top-0 left-0 z-40 bg-slate-900 h-[34px] box-border">Nív</th>
                  <th class="py-1 px-2 w-28 min-w-[110px] max-w-[110px] border-b border-r border-slate-800 sticky top-0 left-[40px] z-40 bg-slate-900 h-[34px] box-border">Código</th>
                  <th class="py-1 px-3 w-[300px] min-w-[300px] max-w-[300px] border-b border-r border-slate-800 sticky top-0 left-[150px] z-40 bg-slate-900 h-[34px] box-border">Descrição EAP</th>
                  <th class="py-1 px-2 w-28 min-w-[110px] max-w-[110px] text-right border-b border-r border-slate-800 sticky top-0 left-[450px] z-40 bg-slate-900 h-[34px] box-border">Orçamento</th>
                  <th class="py-1 px-2 w-20 min-w-[80px] max-w-[80px] text-right border-b border-r border-slate-800 text-blue-300 sticky top-0 left-[560px] z-40 bg-slate-900 sticky-shadow-header-r h-[34px] box-border">% Obra</th>
                  
                  <template x-for="c in activeCyclesList" :key="c.num">
                    <th class="py-1 px-2 text-right min-w-[85px] border-b border-r border-slate-800 sticky top-0 z-30 bg-slate-900 h-[34px] box-border">
                      <div class="flex items-center justify-end space-x-1">
                        <span class="block font-bold text-[11px]" x-text="finViewMode === 'pct' ? c.period_label : (c.period_label + ' (R$)')"></span>
                      </div>
                    </th>
                  </template>
                  
                  <th class="py-1 px-2 text-right min-w-[95px] bg-slate-800 border-b border-slate-800 sticky top-0 z-30 h-[34px] box-border" x-text="finViewMode === 'pct' ? 'Total (%)' : 'Total (R$)'"></th>
                </tr>

                <!-- Row 2: Level 1 Totalizer (Pinned) -->
                <tr class="h-8">
                  <th class="py-0.5 px-2 text-center border-b border-r border-neutral-800 sticky top-[34px] left-0 z-35 sticky-level-1 w-10 min-w-[40px] max-w-[40px] font-bold h-8 box-border">1</th>
                  <th class="py-0.5 px-2 font-mono text-[10px] border-b border-r border-neutral-800 sticky top-[34px] left-[40px] z-35 sticky-level-1 w-28 min-w-[110px] max-w-[110px] font-bold h-8 box-border text-left" x-text="level1FinRow?.code || '1'"></th>
                  <th class="py-0.5 px-3 border-b border-r border-neutral-800 sticky top-[34px] left-[150px] z-35 sticky-level-1 w-[300px] min-w-[300px] max-w-[300px] font-bold h-8 box-border text-left">
                    <div class="truncate" x-text="level1FinRow?.description || 'Platea 19 / Total Geral da Obra'"></div>
                  </th>
                  <th class="py-0.5 px-2 text-right border-b border-r border-neutral-800 sticky top-[34px] left-[450px] z-35 sticky-level-1 w-28 min-w-[110px] max-w-[110px] font-bold h-8 box-border" x-text="formatCurrency(level1FinRow?.budget || replanResult?.total_budget)"></th>
                  <th class="py-0.5 px-2 text-right border-b border-r border-neutral-800 sticky top-[34px] left-[560px] z-35 sticky-level-1 w-20 min-w-[80px] max-w-[80px] font-bold text-emerald-300 sticky-shadow-header-r h-8 box-border">100.00%</th>
                  
                  <template x-for="c in activeCyclesList" :key="c.num">
                    <th class="py-0.5 px-2 text-right min-w-[85px] border-b border-r border-neutral-800 sticky top-[34px] z-25 bg-black text-white font-bold h-8 box-border"
                        x-text="getFinCellValue(level1FinRow, c.num)"></th>
                  </template>

                  <th class="py-0.5 px-2 text-right min-w-[95px] border-b border-neutral-800 sticky top-[34px] z-25 bg-neutral-900 text-emerald-300 font-bold h-8 box-border"
                      x-text="getFinCellTotal(level1FinRow)"></th>
                </tr>
              </thead>

              <tbody class="divide-y divide-slate-200">
                <template x-for="row in filteredFinRows" :key="row.code">
                  <tr class="group" :class="getLevelRowClass(row.level)">
                    <td class="py-0.5 px-2 text-center border-b border-r sticky left-0 z-10 w-10 min-w-[40px] max-w-[40px]" 
                        :class="getLevelStickyClass(row.level)"
                        x-text="row.level"></td>
                    <td class="py-0.5 px-2 font-mono text-[10px] border-b border-r sticky left-[40px] z-10 w-28 min-w-[110px] max-w-[110px]" 
                        :class="getLevelStickyClass(row.level)"
                        x-text="row.code"></td>
                    <td class="py-0.5 px-3 border-b border-r sticky left-[150px] z-10 w-[300px] min-w-[300px] max-w-[300px]" 
                        :class="getLevelStickyClass(row.level)"
                        :style="'padding-left: ' + ((row.level-1)*12 + 8) + 'px'">
                      <div class="truncate" :title="row.description" x-text="row.description"></div>
                    </td>
                    <td class="py-0.5 px-2 text-right border-b border-r font-semibold sticky left-[450px] z-10 w-28 min-w-[110px] max-w-[110px]" 
                        :class="getLevelStickyClass(row.level)"
                        x-text="formatCurrency(row.budget)"></td>
                    <td class="py-0.5 px-2 text-right border-b border-r font-bold sticky left-[560px] z-10 w-20 min-w-[80px] max-w-[80px] sticky-shadow-r" 
                        :class="[getLevelStickyClass(row.level), row.level <= 3 ? 'text-emerald-300' : 'text-blue-700']"
                        x-text="((row.budget / replanResult?.total_budget) * 100).toFixed(2) + '%'"></td>

                    <template x-for="c in activeCyclesList" :key="c.num">
                      <td class="py-0.5 px-2 text-right border-b border-r"
                          x-text="getFinCellValue(row, c.num)">
                      </td>
                    </template>

                    <td class="py-0.5 px-2 text-right font-bold border-b border-r" 
                        :class="row.level <= 3 ? 'text-emerald-300' : 'text-emerald-800'" 
                        x-text="getFinCellTotal(row)"></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </template>
