  <!-- Modal: Import Schedule (.mpp, .xml, .xlsx) -->
  <div 
    x-show="showImportModal" 
    x-cloak 
    class="fixed inset-0 z-50 overflow-y-auto flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-xs">
    <div class="bg-white rounded-2xl max-w-md w-full shadow-2xl border border-slate-200 p-6 space-y-4" @click.outside="showImportModal = false">
      <div class="flex items-center justify-between border-b border-slate-100 pb-3">
        <div class="flex items-center space-x-2">
          <div class="w-8 h-8 rounded-lg bg-blue-50 text-blue-600 flex items-center justify-center">
            <i data-lucide="upload" class="w-4 h-4"></i>
          </div>
          <div>
            <h3 class="font-bold text-slate-900 text-sm">Importar Novo Cronograma</h3>
            <p class="text-[10px] text-slate-500">Cria uma nova versão selecionável do cronograma</p>
          </div>
        </div>
        <button @click="showImportModal = false" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>

      <div class="space-y-3 text-xs">
        <div>
          <label class="block font-bold text-slate-700 mb-1">Nome da Versão:</label>
          <input 
            type="text" 
            x-model="importVersionName" 
            placeholder="Ex: Replanejado 2027 R02 (Meta)" 
            class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-1.5 outline-none focus:border-blue-500">
        </div>

        <div>
          <label class="block font-bold text-slate-700 mb-1">Arquivo (.mpp MS Project, .xml ou .xlsx):</label>
          <div class="border-2 border-dashed border-slate-300 rounded-xl p-4 text-center hover:bg-slate-50 cursor-pointer" @click="$refs.scheduleFileInput.click()">
            <i data-lucide="file-up" class="w-8 h-8 text-blue-500 mx-auto mb-1"></i>
            <p class="font-semibold text-slate-700" x-text="selectedScheduleFile ? selectedScheduleFile.name : 'Clique para selecionar o arquivo'"></p>
            <p class="text-[10px] text-slate-400 mt-1">Formatos suportados: .mpp (Nativo do MS Project), .xml ou .xlsx</p>
          </div>
          <input 
            type="file" 
            x-ref="scheduleFileInput" 
            @change="selectedScheduleFile = $event.target.files[0]" 
            accept=".mpp,.xml,.xlsx,.xls" 
            class="hidden">
        </div>
      </div>

      <div class="flex items-center justify-end space-x-2 pt-2 border-t border-slate-100">
        <button @click="showImportModal = false" class="px-3 py-1.5 rounded-lg border border-slate-300 text-slate-600 font-semibold hover:bg-slate-50 text-xs">Cancelar</button>
        <button 
          @click="uploadScheduleFile()" 
          :disabled="!selectedScheduleFile || isUploading"
          class="px-4 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-semibold text-xs shadow-sm disabled:opacity-40 flex items-center space-x-1.5">
          <i data-lucide="upload-cloud" class="w-3.5 h-3.5"></i>
          <span x-text="isUploading ? 'Importando...' : 'Confirmar Importação'"></span>
        </button>
      </div>
    </div>
  </div>
