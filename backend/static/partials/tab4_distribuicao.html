    <!-- TAB 4: DISTRIBUIÇÃO (NÍVEL 6 & PESOS) - UNLOADED WHEN INACTIVE -->
    <template x-if="activeTab === 'distribuicao'">
      <div class="bg-white rounded-xl shadow-xs border border-slate-200 overflow-hidden">
        <div class="p-3 border-b border-slate-200 flex flex-wrap items-center justify-between gap-3">
          <div>
            <h3 class="font-bold text-slate-900 text-xs">Distribuição (Nível 6 x Físico-Financeiro)</h3>
            <p class="text-[10px] text-slate-500">Desdobramento dos serviços do orçamento nas atividades do cronograma com pesos ponderados</p>
          </div>

          <div class="flex flex-wrap items-center gap-2">
            <div x-data="{ vbDomain: 'distribuicao' }">
<!-- @include partials/version_bar.html -->
            </div>
            <!-- Reset Links Button -->
            <template x-if="hasCustomLinks()">
              <button 
                @click="resetLinks()" 
                class="flex items-center space-x-1.5 px-2.5 py-1 rounded-lg bg-amber-50 hover:bg-amber-100 text-amber-800 border border-amber-300 text-xs font-semibold transition shadow-2xs">
                <i data-lucide="rotate-ccw" class="w-3.5 h-3.5 text-amber-600"></i>
                <span>Restaurar Vínculos Originais</span>
              </button>
            </template>

            <!-- View Mode Switcher (% Obra / % do Serviço / R$) -->
            <div class="flex items-center bg-slate-100 p-0.5 rounded-lg border border-slate-200 text-[11px] font-semibold">
              <button 
                @click="distViewMode = 'pct'" 
                :class="distViewMode === 'pct' ? 'bg-white text-blue-700 shadow-xs' : 'text-slate-600 hover:text-slate-900'"
                class="px-2.5 py-0.5 rounded transition">
                % Obra
              </button>
              <button 
                @click="distViewMode = 'pct_service'" 
                :class="distViewMode === 'pct_service' ? 'bg-white text-blue-700 shadow-xs' : 'text-slate-600 hover:text-slate-900'"
                class="px-2.5 py-0.5 rounded transition">
                % do Serviço
              </button>
              <button 
                @click="distViewMode = 'val'" 
                :class="distViewMode === 'val' ? 'bg-white text-blue-700 shadow-xs' : 'text-slate-600 hover:text-slate-900'"
                class="px-2.5 py-0.5 rounded transition">
                R$ Financeiro
              </button>
            </div>

            <input 
              type="text" 
              x-model="searchDist" 
              placeholder="Filtrar distribuição..." 
              class="bg-slate-50 border border-slate-300 rounded px-2.5 py-1 text-xs w-52 outline-none">
          </div>
        </div>

        <!-- Active Month Filter Banner -->
        <div x-show="selectedFilterMonths.length > 0" class="mx-3 my-2 flex items-center justify-between bg-blue-50 border border-blue-200 rounded-lg px-3 py-1.5 text-xs text-blue-900">
          <div class="flex items-center space-x-2">
            <i data-lucide="filter" class="w-3.5 h-3.5 text-blue-600 shrink-0"></i>
            <span>Filtrando por mês(es): <strong class="font-bold text-blue-800" x-text="getMonthFilterLabel()"></strong> (<span x-text="filteredDistRows.length"></span> linhas ativas)</span>
          </div>
          <button @click="clearMonthFilter()" class="flex items-center space-x-1 text-[11px] font-bold text-blue-700 hover:text-blue-900 bg-white border border-blue-300 rounded px-2 py-0.5 transition hover:bg-blue-100/60 shadow-2xs">
            <span>Limpar Filtro</span>
            <i data-lucide="x" class="w-3 h-3"></i>
          </button>
        </div>

        <div class="overflow-x-auto max-h-[600px] 2xl:max-h-[750px] scrollbar-thin">
          <table class="w-full text-left table-compact border-separate border-spacing-0">
            <thead class="bg-slate-900 text-white sticky top-0 z-20">
              <!-- Row 1: Column Titles -->
              <tr class="h-[34px]">
                <th class="py-1 px-2 w-10 min-w-[40px] max-w-[40px] text-center border-b border-r border-slate-800 sticky top-0 left-0 z-40 bg-slate-900 h-[34px] box-border">Nív</th>
                <th class="py-1 px-2 w-28 min-w-[110px] max-w-[110px] border-b border-r border-slate-800 sticky top-0 left-[40px] z-40 bg-slate-900 h-[34px] box-border">Código</th>
                <th class="py-1 px-3 w-[280px] min-w-[280px] max-w-[280px] border-b border-r border-slate-800 sticky top-0 left-[150px] z-40 bg-slate-900 h-[34px] box-border">Descrição / Tarefa</th>
                <th class="py-1 px-2 w-20 min-w-[80px] max-w-[80px] text-center border-b border-r border-slate-800 sticky top-0 left-[430px] z-40 bg-slate-900 h-[34px] box-border">Ações</th>
                <th class="py-1 px-2 text-center w-14 min-w-[56px] max-w-[56px] border-b border-r border-slate-800 sticky top-0 left-[510px] z-40 bg-slate-900 h-[34px] box-border">Dur.</th>
                <th class="py-1 px-2 text-right w-16 min-w-[64px] max-w-[64px] border-b border-r border-slate-800 sticky top-0 left-[566px] z-40 bg-slate-900 h-[34px] box-border">Peso</th>
                <th class="py-1 px-2 text-right w-28 min-w-[110px] max-w-[110px] border-b border-r border-slate-800 sticky top-0 left-[630px] z-40 bg-slate-900 sticky-shadow-header-r h-[34px] box-border" x-text="distViewMode === 'pct' ? 'Alocado (% Obra)' : (distViewMode === 'pct_service' ? 'Alocado (Peso)' : 'Alocado (R$)')"></th>
                <template x-for="c in replanResult?.cycles" :key="c.num">
                  <th 
                    @click="toggleMonthFilter(c.num)" 
                    :class="isMonthFilterActive(c.num) ? 'bg-blue-600 text-white ring-2 ring-blue-300 font-extrabold cursor-pointer' : 'hover:bg-slate-800 cursor-pointer'"
                    :title="'Clique para filtrar apenas atividades com valores em ' + (c.period_label || c.name)"
                    class="py-1 px-2 text-right min-w-[85px] border-b border-r border-slate-800 leading-tight transition-colors select-none group sticky top-0 z-30 bg-slate-900 h-[34px] box-border">
                    <div class="flex items-center justify-end space-x-1">
                      <i data-lucide="filter" x-show="isMonthFilterActive(c.num)" class="w-2.5 h-2.5 text-amber-300 shrink-0"></i>
                      <span class="block font-bold text-[11px]" x-text="c.name"></span>
                    </div>
                    <span class="block text-[9px] font-normal" :class="isMonthFilterActive(c.num) ? 'text-blue-100' : 'text-slate-400'" x-text="c.period_label"></span>
                  </th>
                </template>
                <th class="py-1 px-2 text-right min-w-[95px] bg-slate-800 border-b border-slate-800 sticky top-0 z-30 h-[34px] box-border" x-text="distViewMode === 'val' ? 'Total (R$)' : 'Total (%)'"></th>
              </tr>
              <!-- Row 2: Level 1 Totalizer (Pinned) -->
              <tr class="h-8">
                <th class="py-0.5 px-2 text-center border-b border-r border-neutral-800 sticky top-[34px] left-0 z-35 sticky-level-1 w-10 min-w-[40px] max-w-[40px] font-bold h-8 box-border">1</th>
                <th class="py-0.5 px-2 font-mono text-[10px] border-b border-r border-neutral-800 sticky top-[34px] left-[40px] z-35 sticky-level-1 w-28 min-w-[110px] max-w-[110px] font-bold h-8 box-border text-left" x-text="level1FFRow?.code || '1'"></th>
                <th class="py-0.5 px-3 border-b border-r border-neutral-800 sticky top-[34px] left-[150px] z-35 sticky-level-1 w-[280px] min-w-[280px] max-w-[280px] font-bold h-8 box-border text-left">
                  <div class="truncate" x-text="level1FFRow?.description || 'Platea 19 / Total Geral da Obra'"></div>
                </th>
                <th class="py-0.5 px-2 text-center border-b border-r border-neutral-800 sticky top-[34px] left-[430px] z-35 sticky-level-1 w-20 min-w-[80px] max-w-[80px] text-[10px] text-slate-400 h-8 box-border">-</th>
                <th class="py-0.5 px-2 text-center border-b border-r border-neutral-800 sticky top-[34px] left-[510px] z-35 sticky-level-1 w-14 min-w-[56px] max-w-[56px] text-[10px] text-slate-400 h-8 box-border">-</th>
                <th class="py-0.5 px-2 text-right border-b border-r border-neutral-800 sticky top-[34px] left-[566px] z-35 sticky-level-1 w-16 min-w-[64px] max-w-[64px] text-[10px] text-slate-400 h-8 box-border">-</th>
                <th class="py-0.5 px-2 text-right border-b border-r border-neutral-800 sticky top-[34px] left-[630px] z-35 sticky-level-1 w-28 min-w-[110px] max-w-[110px] font-bold sticky-shadow-header-r h-8 box-border"
                    x-text="distViewMode === 'val' ? formatCurrency(level1FFRow?.budget) : '100.00%'"></th>
                <template x-for="c in replanResult?.cycles" :key="c.num">
                  <th class="py-0.5 px-2 text-right min-w-[85px] border-b border-r border-neutral-800 sticky top-[34px] z-25 bg-black text-white font-bold h-8 box-border"
                      x-text="distViewMode === 'val' ? formatCurrency(level1FFRow?.cycle_vals?.[String(c.num)]) : (level1FFRow?.cycle_pcts?.[String(c.num)] > 0 ? level1FFRow?.cycle_pcts?.[String(c.num)].toFixed(2) + '%' : '-')"></th>
                </template>
                <th class="py-0.5 px-2 text-right min-w-[95px] border-b border-neutral-800 sticky top-[34px] z-25 bg-neutral-900 text-white font-bold h-8 box-border"
                    x-text="distViewMode === 'val' ? formatCurrency(level1FFRow?.total) : (level1FFRow?.total_pct ? level1FFRow?.total_pct.toFixed(2) + '%' : '100.00%')"></th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-200">
              <template x-for="row in paginatedDistRows" :key="row.code">
                <tr class="group" :class="row.level === 5 ? 'row-level-5' : 'row-level-6'">
                  <td class="py-0.5 px-2 text-center border-b border-r sticky left-0 z-10 w-10 min-w-[40px] max-w-[40px]" 
                      :class="row.level === 5 ? 'sticky-level-5' : 'sticky-level-6'"
                      x-text="row.level"></td>
                  <td class="py-0.5 px-2 font-mono text-[10px] border-b border-r sticky left-[40px] z-10 w-28 min-w-[110px] max-w-[110px]" 
                      :class="row.level === 5 ? 'sticky-level-5' : 'sticky-level-6'"
                      x-text="row.code"></td>
                  <td class="py-0.5 px-3 border-b border-r sticky left-[150px] z-10 w-[280px] min-w-[280px] max-w-[280px]" 
                      :class="row.level === 5 ? 'sticky-level-5' : 'sticky-level-6'"
                      :style="'padding-left: ' + (row.level === 6 ? '24px' : '8px')">
                    <div class="truncate" :title="row.description">
                      <span x-show="row.level === 6" class="text-blue-500 mr-1 font-bold">↳</span>
                      <span x-text="row.description"></span>
                    </div>
                  </td>

                  <!-- Ações Column -->
                  <td class="py-0.5 px-2 text-center border-b border-r sticky left-[430px] z-10 w-20 min-w-[80px] max-w-[80px]"
                      :class="row.level === 5 ? 'sticky-level-5' : 'sticky-level-6'">
                    <template x-if="row.level === 5">
                      <button 
                        @click.stop="openLinkModal(row.code, -1)" 
                        title="Vincular atividade do cronograma a este serviço" 
                        class="p-1 rounded text-blue-600 hover:text-blue-800 hover:bg-blue-100 transition inline-flex items-center justify-center">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="w-3.5 h-3.5"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
                      </button>
                    </template>
                    <template x-if="row.level === 6">
                      <div class="inline-flex items-center space-x-1">
                        <button 
                          @click.stop="openLinkModal(row.parent_code, row.link_index)" 
                          title="Trocar / Editar atividade vinculada" 
                          class="p-1 rounded text-slate-500 hover:text-blue-700 hover:bg-blue-50 transition">
                          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="w-3.5 h-3.5"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>
                        </button>
                        <button 
                          @click.stop="removeLink(row.parent_code, row.link_index)" 
                          title="Excluir este vínculo" 
                          class="p-1 rounded text-slate-400 hover:text-red-600 hover:bg-red-50 transition">
                          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="w-3.5 h-3.5"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>
                        </button>
                      </div>
                    </template>
                  </td>

                  <td class="py-0.5 px-2 text-center border-b border-r sticky left-[510px] z-10 w-14 min-w-[56px] max-w-[56px]" 
                      :class="row.level === 5 ? 'sticky-level-5 text-slate-800 font-semibold' : 'sticky-level-6 text-slate-600'"
                      x-text="row.duration !== undefined && row.duration !== null ? row.duration : '-'"></td>
                  <td class="py-0.5 px-2 text-right border-b border-r sticky left-[566px] z-10 w-16 min-w-[64px] max-w-[64px] font-semibold" 
                      :class="row.level === 5 ? 'sticky-level-5 text-slate-900' : 'sticky-level-6 text-amber-700'" 
                      x-text="row.weight_pct.toFixed(2) + '%'"></td>
                  
                  <!-- Alocado column (Last frozen column) -->
                  <td class="py-0.5 px-2 text-right border-b border-r font-semibold sticky left-[630px] z-10 w-28 min-w-[110px] max-w-[110px] sticky-shadow-r" 
                      :class="row.level === 5 ? 'sticky-level-5 text-slate-900' : 'sticky-level-6 text-slate-800'"
                      x-text="distViewMode === 'pct' ? ((row.allocated_pct_obra || ((row.allocated_val / replanResult?.total_budget) * 100)).toFixed(2) + '%') : (distViewMode === 'pct_service' ? (row.weight_pct.toFixed(2) + '%') : formatCurrency(row.allocated_val))">
                  </td>
                  
                  <!-- Monthly cycle columns with cell-l6-has-val highlight -->
                  <template x-for="c in replanResult?.cycles" :key="c.num">
                    <td class="py-0.5 px-2 text-right border-b border-r border-slate-200 transition-colors" 
                        :class="row.level === 6 && hasDistCycleVal(row, c.num) ? 'cell-l6-has-val' : ''"
                        x-text="distViewMode === 'pct' ? 
                                ((row.cycle_pcts_obra && row.cycle_pcts_obra[String(c.num)] > 0) ? (row.cycle_pcts_obra[String(c.num)].toFixed(2) + '%') : (((row.cycle_vals && row.cycle_vals[String(c.num)] > 0)) ? (((row.cycle_vals[String(c.num)]) / replanResult?.total_budget) * 100).toFixed(2) + '%' : '-')) : 
                                (distViewMode === 'pct_service' ? 
                                ((row.cycle_pcts && row.cycle_pcts[String(c.num)] > 0) ? (row.cycle_pcts[String(c.num)].toFixed(2) + '%') : (row.allocated_val > 0 && (row.cycle_vals && row.cycle_vals[String(c.num)] > 0) ? (((row.cycle_vals[String(c.num)]) / row.allocated_val) * 100).toFixed(2) + '%' : '-')) : 
                                ((row.cycle_vals && row.cycle_vals[String(c.num)] > 0) ? formatCurrency(row.cycle_vals[String(c.num)]) : '-'))">
                    </td>
                  </template>

                  <!-- Total column -->
                  <td class="py-0.5 px-2 text-right font-bold bg-slate-50 border-b border-slate-200" 
                      x-text="distViewMode === 'pct' ? 
                              ((row.total_pct_obra || ((row.total || 0) / replanResult?.total_budget) * 100).toFixed(2) + '%') : 
                              (distViewMode === 'pct_service' ? 
                              ((row.total_pct || 100.0).toFixed(2) + '%') : 
                              formatCurrency(row.total))">
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
          <!-- Rolagem infinita: o marcador carrega mais linhas quando fica visível -->
          <div x-init="observeMore($el, 'distPage', () => filteredDistRows.length)" class="h-1"></div>
        </div>

        <div class="p-2 border-t border-slate-200 text-xs text-slate-600 bg-slate-50">
          Mostrando <span class="font-bold" x-text="Math.min(distPage * distPageSize, filteredDistRows.length)"></span> de
          <span class="font-bold" x-text="filteredDistRows.length"></span> linhas
          <span x-show="distPage * distPageSize < filteredDistRows.length" class="text-slate-400">· role para carregar mais</span>
        </div>
      </div>
    </template>
