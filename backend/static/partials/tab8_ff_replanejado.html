    <!-- TAB 8: FÍSICO-FINANCEIRO REPLANEJADO CONSOLIDADO -->
    <template x-if="activeTab === 'ff_replanejado'">
      <div class="bg-white rounded-xl shadow-xs border border-slate-200 overflow-hidden">
        <div class="p-3 border-b border-slate-200 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
          <div>
            <div class="flex items-center space-x-2">
              <h3 class="font-bold text-slate-900 text-xs">Físico-Financeiro Replanejado (Consolidado)</h3>
              <span class="text-[10px] px-2 py-0.5 bg-emerald-100 text-emerald-800 rounded-full font-bold">100% Orçamento Fechado</span>
            </div>
            <p class="text-[10px] text-slate-500">Histórico blindado com Realizado Medido + Saldo futuro replanejado</p>
          </div>

          <div class="flex flex-wrap items-center gap-2">
            <!-- Level Filter Quick Buttons -->
            <div class="flex items-center space-x-1 bg-slate-100 p-0.5 rounded-lg border border-slate-200 text-[11px] font-semibold">
              <span class="text-[10px] text-slate-400 px-1 uppercase font-bold">Nível:</span>
              <button 
                @click="levelFilterFFRep = 2" 
                :class="levelFilterFFRep === 2 ? 'bg-emerald-600 text-white shadow-xs' : 'text-slate-600 hover:text-slate-900'"
                class="px-2 py-0.5 rounded transition">
                Até Nível 2
              </button>
              <button 
                @click="levelFilterFFRep = 3" 
                :class="levelFilterFFRep === 3 ? 'bg-emerald-600 text-white shadow-xs' : 'text-slate-600 hover:text-slate-900'"
                class="px-2 py-0.5 rounded transition">
                Até Nível 3 (Padrão)
              </button>
              <button 
                @click="levelFilterFFRep = 4" 
                :class="levelFilterFFRep === 4 ? 'bg-emerald-600 text-white shadow-xs' : 'text-slate-600 hover:text-slate-900'"
                class="px-2 py-0.5 rounded transition">
                Até Nível 4
              </button>
              <button 
                @click="levelFilterFFRep = 0" 
                :class="levelFilterFFRep === 0 ? 'bg-emerald-600 text-white shadow-xs' : 'text-slate-600 hover:text-slate-900'"
                class="px-2 py-0.5 rounded transition">
                Todos os Níveis
              </button>
            </div>

            <!-- View Mode Switcher (% / R$) -->
            <div class="flex items-center bg-slate-100 p-0.5 rounded-lg border border-slate-200 text-[11px] font-semibold">
              <button 
                @click="ffRepViewMode = 'pct'" 
                :class="ffRepViewMode === 'pct' ? 'bg-white text-emerald-700 shadow-xs' : 'text-slate-600 hover:text-slate-900'"
                class="px-2.5 py-0.5 rounded transition">
                % Obra
              </button>
              <button 
                @click="ffRepViewMode = 'val'" 
                :class="ffRepViewMode === 'val' ? 'bg-white text-emerald-700 shadow-xs' : 'text-slate-600 hover:text-slate-900'"
                class="px-2.5 py-0.5 rounded transition">
                R$ Financeiro
              </button>
            </div>
          </div>
        </div>

        <!-- Active Month Filter Banner -->
        <div x-show="selectedFilterMonths.length > 0" class="mx-3 my-2 flex items-center justify-between bg-blue-50 border border-blue-200 rounded-lg px-3 py-1.5 text-xs text-blue-900">
          <div class="flex items-center space-x-2">
            <i data-lucide="filter" class="w-3.5 h-3.5 text-blue-600 shrink-0"></i>
            <span>Filtrando por mês(es): <strong class="font-bold text-blue-800" x-text="getMonthFilterLabel()"></strong> (<span x-text="filteredFFRepRows.length"></span> linhas ativas)</span>
          </div>
          <button @click="clearMonthFilter()" class="flex items-center space-x-1 text-[11px] font-bold text-blue-700 hover:text-blue-900 bg-white border border-blue-300 rounded px-2 py-0.5 transition hover:bg-blue-100/60 shadow-2xs">
            <span>Limpar Filtro</span>
            <i data-lucide="x" class="w-3 h-3"></i>
          </button>
        </div>

        <div class="overflow-x-auto max-h-[600px] 2xl:max-h-[750px] scrollbar-thin">
          <table class="w-full text-left table-compact border-separate border-spacing-0">
            <thead class="bg-slate-900 text-white sticky top-0 z-20">
              <!-- Row 1: Column Titles -->
              <tr class="h-[34px]">
                <th class="py-1 px-2 w-10 min-w-[40px] max-w-[40px] text-center border-b border-r border-slate-800 sticky top-0 left-0 z-40 bg-slate-900 h-[34px] box-border">Nív</th>
                <th class="py-1 px-2 w-28 min-w-[110px] max-w-[110px] border-b border-r border-slate-800 sticky top-0 left-[40px] z-40 bg-slate-900 h-[34px] box-border">Código</th>
                <th class="py-1 px-3 w-[300px] min-w-[300px] max-w-[300px] border-b border-r border-slate-800 sticky top-0 left-[150px] z-40 bg-slate-900 h-[34px] box-border">Descrição EAP</th>
                <th class="py-1 px-2 w-28 min-w-[110px] max-w-[110px] text-right border-b border-r border-slate-800 sticky top-0 left-[450px] z-40 bg-slate-900 h-[34px] box-border">Orçamento</th>
                <th class="py-1 px-2 w-20 min-w-[80px] max-w-[80px] text-right border-b border-r border-slate-800 text-blue-300 sticky top-0 left-[560px] z-40 bg-slate-900 sticky-shadow-header-r h-[34px] box-border">% Obra</th>
                <template x-for="c in replanResult?.cycles" :key="c.num">
                  <th 
                    @click="toggleMonthFilter(c.num)" 
                    :class="isMonthFilterActive(c.num) ? 'bg-blue-600 text-white ring-2 ring-blue-300 font-extrabold cursor-pointer' : (c.num <= cutoffMedNum ? 'bg-slate-900 text-emerald-400 hover:bg-slate-800 cursor-pointer' : 'bg-emerald-950 text-emerald-200 hover:bg-emerald-900 cursor-pointer')"
                    :title="'Clique para filtrar atividades com valor em ' + (c.period_label || c.name)"
                    class="py-1 px-2 text-right min-w-[85px] border-b border-r border-slate-800 transition-colors select-none cursor-pointer group sticky top-0 z-30 bg-slate-900 h-[34px] box-border">
                    <div class="flex items-center justify-end space-x-1">
                      <i data-lucide="filter" x-show="isMonthFilterActive(c.num)" class="w-2.5 h-2.5 text-amber-300 shrink-0"></i>
                      <span class="block font-bold text-[11px]" x-text="ffRepViewMode === 'pct' ? c.name : (c.name + ' (R$)')"></span>
                    </div>
                  </th>
                </template>
                <th class="py-1 px-2 text-right min-w-[95px] bg-slate-800 border-b border-slate-800 sticky top-0 z-30 h-[34px] box-border" x-text="ffRepViewMode === 'pct' ? 'Total (%)' : 'Total (R$)'"></th>
              </tr>
              <!-- Row 2: Level 1 Totalizer (Pinned) -->
              <tr class="h-8">
                <th class="py-0.5 px-2 text-center border-b border-r border-neutral-800 sticky top-[34px] left-0 z-35 sticky-level-1 w-10 min-w-[40px] max-w-[40px] font-bold h-8 box-border">1</th>
                <th class="py-0.5 px-2 font-mono text-[10px] border-b border-r border-neutral-800 sticky top-[34px] left-[40px] z-35 sticky-level-1 w-28 min-w-[110px] max-w-[110px] font-bold h-8 box-border text-left" x-text="level1FFRepRow?.code || '1'"></th>
                <th class="py-0.5 px-3 border-b border-r border-neutral-800 sticky top-[34px] left-[150px] z-35 sticky-level-1 w-[300px] min-w-[300px] max-w-[300px] font-bold h-8 box-border text-left">
                  <div class="truncate" x-text="level1FFRepRow?.description || 'Platea 19 / Total Geral da Obra'"></div>
                </th>
                <th class="py-0.5 px-2 text-right border-b border-r border-neutral-800 sticky top-[34px] left-[450px] z-35 sticky-level-1 w-28 min-w-[110px] max-w-[110px] font-bold h-8 box-border" x-text="formatCurrency(level1FFRepRow?.budget || replanResult?.total_budget)"></th>
                <th class="py-0.5 px-2 text-right border-b border-r border-neutral-800 sticky top-[34px] left-[560px] z-35 sticky-level-1 w-20 min-w-[80px] max-w-[80px] font-bold text-emerald-300 sticky-shadow-header-r h-8 box-border">100.00%</th>
                <template x-for="c in replanResult?.cycles" :key="c.num">
                  <th class="py-0.5 px-2 text-right min-w-[85px] border-b border-r border-neutral-800 sticky top-[34px] z-25 bg-black text-white font-bold h-8 box-border"
                      x-text="ffRepViewMode === 'pct' ? (level1FFRepRow?.cycle_pcts?.[String(c.num)] > 0 ? level1FFRepRow?.cycle_pcts?.[String(c.num)].toFixed(2) + '%' : '-') : formatCurrency(level1FFRepRow?.cycle_vals?.[String(c.num)])"></th>
                </template>
                <th class="py-0.5 px-2 text-right min-w-[95px] border-b border-neutral-800 sticky top-[34px] z-25 bg-neutral-900 text-emerald-300 font-bold h-8 box-border"
                    x-text="ffRepViewMode === 'pct' ? (level1FFRepRow?.total_pct ? level1FFRepRow?.total_pct.toFixed(2) + '%' : '100.00%') : formatCurrency(level1FFRepRow?.total)"></th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-200">
              <template x-for="row in filteredFFRepRows" :key="row.code">
                <tr class="group" :class="getLevelRowClass(row.level)">
                  <td class="py-0.5 px-2 text-center border-b border-r sticky left-0 z-10 w-10 min-w-[40px] max-w-[40px]" 
                      :class="getLevelStickyClass(row.level)"
                      x-text="row.level"></td>
                  <td class="py-0.5 px-2 font-mono text-[10px] border-b border-r sticky left-[40px] z-10 w-28 min-w-[110px] max-w-[110px]" 
                      :class="getLevelStickyClass(row.level)"
                      x-text="row.code"></td>
                  <td class="py-0.5 px-3 border-b border-r sticky left-[150px] z-10 w-[300px] min-w-[300px] max-w-[300px]" 
                      :class="getLevelStickyClass(row.level)"
                      :style="'padding-left: ' + ((row.level-1)*12 + 8) + 'px'">
                    <div class="truncate" :title="row.description" x-text="row.description"></div>
                  </td>
                  <td class="py-0.5 px-2 text-right border-b border-r font-semibold sticky left-[450px] z-10 w-28 min-w-[110px] max-w-[110px]" 
                      :class="getLevelStickyClass(row.level)"
                      x-text="formatCurrency(row.budget)"></td>
                  <td class="py-0.5 px-2 text-right border-b border-r font-bold sticky left-[560px] z-10 w-20 min-w-[80px] max-w-[80px] sticky-shadow-r" 
                      :class="[getLevelStickyClass(row.level), row.level <= 3 ? 'text-emerald-300' : 'text-blue-700']"
                      x-text="((row.budget / replanResult?.total_budget) * 100).toFixed(2) + '%'"></td>

                  <template x-for="c in replanResult?.cycles" :key="c.num">
                    <td 
                      class="py-0.5 px-2 text-right border-b border-r" 
                      :class="c.num <= cutoffMedNum ? 'bg-emerald-50/20 text-emerald-800' : ''"
                      x-text="ffRepViewMode === 'pct' ? (row.cycle_pcts[String(c.num)] > 0 ? row.cycle_pcts[String(c.num)].toFixed(2) + '%' : '-') : formatCurrency(row.cycle_vals[String(c.num)])">
                    </td>
                  </template>
                  <td class="py-0.5 px-2 text-right font-bold border-b border-r" :class="row.level <= 3 ? 'text-emerald-300' : 'text-emerald-800'" x-text="ffRepViewMode === 'pct' ? (row.total_pct ? row.total_pct.toFixed(2) + '%' : '0.00%') : formatCurrency(row.total)"></td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </div>
    </template>
