  <!-- Modal: Importar Nova Obra -->
  <div 
    x-show="showUploadModal" 
    x-cloak 
    class="fixed inset-0 z-50 overflow-y-auto flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs"
    @keydown.escape.window="showUploadModal = false">
    <div class="bg-white rounded-2xl max-w-lg w-full shadow-2xl border border-slate-200 p-6 space-y-4" @click.outside="showUploadModal = false">
      <div class="flex items-center justify-between border-b border-slate-100 pb-3">
        <div class="flex items-center space-x-2.5">
          <div class="w-9 h-9 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center font-bold">
            <i data-lucide="upload-cloud" class="w-5 h-5"></i>
          </div>
          <div>
            <h3 class="font-bold text-slate-900 text-sm">Importar Nova Obra / Planilha</h3>
            <p class="text-[10px] text-slate-500">Cadastre um novo empreendimento no sistema</p>
          </div>
        </div>
        <button @click="showUploadModal = false" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>

      <div class="space-y-4 text-xs">
        <div>
          <label class="block font-bold text-slate-700 mb-1">Nome do Empreendimento / Obra: <span class="text-rose-500">*</span></label>
          <input 
            type="text" 
            x-model="uploadProjectName" 
            placeholder="Ex: Residencial Horizonte" 
            class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 outline-none focus:border-blue-500 focus:bg-white text-xs font-semibold">
        </div>

        <div>
          <label class="block font-bold text-slate-700 mb-1">Planilha Excel (.xlsx ou .xlsm): <span class="text-rose-500">*</span></label>
          <div class="p-3 bg-slate-50 border border-dashed border-slate-300 rounded-xl flex flex-col items-center justify-center text-center">
            <i data-lucide="file-spreadsheet" class="w-8 h-8 text-emerald-600 mb-1"></i>
            <span class="text-[11px] font-semibold text-slate-700 mb-2">Obra completa: abas Orçamento, Cronograma, Distribuição e Medição</span>
            <input 
              id="uploadProjectFileInput" 
              type="file" 
              accept=".xlsx,.xlsm" 
              class="text-xs text-slate-600 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer">
          </div>
        </div>

        <div>
          <label class="block font-bold text-slate-700 mb-1">Cronograma Complementar (Opcional - .xml, .mpp, .xlsx):</label>
          <input 
            id="uploadProjectScheduleInput" 
            type="file" 
            accept=".xml,.mpp,.xlsx,.xlsm" 
            class="w-full text-xs text-slate-600 bg-slate-50 border border-slate-200 rounded-lg p-2 file:mr-2 file:py-1 file:px-2.5 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-slate-200 file:text-slate-700 cursor-pointer">
          <p class="text-[10px] text-slate-400 mt-1">Opcional se a sua planilha Excel já contiver a aba Cronograma.</p>
        </div>

        <!-- Download Template Tip Box -->
        <div class="p-3 bg-blue-50/70 border border-blue-200 rounded-xl flex items-center justify-between">
          <div class="flex items-center space-x-2">
            <i data-lucide="info" class="w-4 h-4 text-blue-600 flex-shrink-0"></i>
            <div class="text-[11px] text-blue-800">
              <span class="font-bold">Ainda não tem a planilha no padrão?</span>
              <p class="text-[10px] text-blue-600">Baixe o modelo com as 4 abas e um exemplo preenchido.</p>
            </div>
          </div>
          <button 
            type="button" 
            @click="downloadTemplate()" 
            class="px-2.5 py-1.5 bg-white hover:bg-blue-50 text-blue-700 font-bold text-[10px] rounded-lg border border-blue-300 shadow-2xs whitespace-nowrap flex items-center space-x-1">
            <i data-lucide="download" class="w-3 h-3"></i>
            <span>Baixar Modelo</span>
          </button>
        </div>
      </div>

      <div class="flex items-center justify-end space-x-2 border-t border-slate-100 pt-3">
        <button 
          @click="showUploadModal = false" 
          :disabled="isUploadingProject"
          class="px-3.5 py-2 rounded-lg border border-slate-300 text-slate-600 font-semibold hover:bg-slate-50 text-xs">
          Cancelar
        </button>
        <button 
          @click="submitUploadProject()" 
          :disabled="isUploadingProject"
          class="px-4 py-2 rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-semibold text-xs shadow-sm disabled:opacity-50 flex items-center space-x-1.5">
          <i data-lucide="upload-cloud" class="w-3.5 h-3.5"></i>
          <span x-text="isUploadingProject ? 'Processando e Carregando...' : 'Importar & Abrir Obra'"></span>
        </button>
      </div>
    </div>
  </div>
