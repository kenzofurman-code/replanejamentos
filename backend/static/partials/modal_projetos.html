  <!-- Modal: Projects Selection -->
  <div 
    x-show="showProjectModal" 
    x-cloak 
    class="fixed inset-0 z-50 overflow-y-auto flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-xs">
    <div class="bg-white rounded-2xl max-w-xl w-full shadow-2xl border border-slate-200 p-6 space-y-4" @click.outside="showProjectModal = false">
      <div class="flex items-center justify-between border-b border-slate-100 pb-3">
        <div>
          <h3 class="font-bold text-slate-900 text-sm">Obras & Empreendimentos</h3>
          <p class="text-[10px] text-slate-500">Selecione o empreendimento para gerenciar o planejamento físico-financeiro</p>
        </div>
        <button @click="showProjectModal = false" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>

      <!-- Quick Action Buttons -->
      <div class="flex items-center justify-between gap-2 p-2 bg-slate-50 rounded-xl border border-slate-200/80">
        <button 
          @click="downloadTemplate()"
          class="flex items-center space-x-1.5 text-xs font-semibold text-slate-700 bg-white hover:bg-slate-100 px-3 py-1.5 rounded-lg border border-slate-200 shadow-2xs transition">
          <i data-lucide="download" class="w-3.5 h-3.5 text-emerald-600"></i>
          <span>Baixar Modelo Padrão (.xlsx)</span>
        </button>
        <button 
          @click="showProjectModal = false; showUploadModal = true"
          class="flex items-center space-x-1.5 text-xs font-semibold text-white bg-blue-600 hover:bg-blue-700 px-3 py-1.5 rounded-lg shadow-2xs transition">
          <i data-lucide="plus-circle" class="w-3.5 h-3.5"></i>
          <span>Importar Nova Obra</span>
        </button>
      </div>

      <div class="max-h-96 overflow-y-auto space-y-2 pr-1 scrollbar-thin">
        <template x-for="p in projects" :key="p.id">
          <div 
            @click="selectProject(p.id)" 
            :class="selectedProjectId === p.id ? 'border-blue-500 bg-blue-50/50' : 'border-slate-200 hover:bg-slate-50'"
            class="p-3 rounded-xl border flex items-center justify-between cursor-pointer transition">
            <div class="flex items-center space-x-3">
              <div class="w-8 h-8 rounded-lg bg-blue-100 text-blue-700 flex items-center justify-center font-bold text-xs">
                <span x-text="p.name.charAt(0)"></span>
              </div>
              <div>
                <h4 class="font-bold text-slate-800 text-xs" x-text="p.name"></h4>
                <p class="text-[10px] text-slate-400 font-mono" x-text="p.folder_name"></p>
              </div>
            </div>
            <div class="flex items-center space-x-2">
              <span 
                :class="p.has_ff ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-100 text-slate-500'" 
                class="text-[9px] font-bold px-2 py-0.5 rounded-full" 
                x-text="p.has_ff ? 'Físico-Financeiro OK' : 'Sem Físico-Financeiro'">
              </span>
              <template x-if="p.is_uploaded">
                <button 
                  @click.stop="deleteProject(p.id, p.name)" 
                  title="Excluir obra" 
                  class="p-1 text-slate-400 hover:text-rose-600 rounded-md hover:bg-rose-50 transition">
                  <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                </button>
              </template>
              <i data-lucide="chevron-right" class="w-4 h-4 text-slate-400"></i>
            </div>
          </div>
        </template>
      </div>
    </div>
  </div>
