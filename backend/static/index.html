<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Piemonte Engenharia - Replanejamento Físico-Financeiro & Cronograma</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Alpine.js -->
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="bg-slate-100 text-slate-800 antialiased font-sans min-h-screen flex flex-col" x-data="replanApp()">

  <!-- Top Navbar -->
  <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50 shadow-md">
    <div class="w-full px-4 sm:px-6 lg:px-8 h-14 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center text-white font-bold text-lg shadow-inner">
          P
        </div>
        <div>
          <h1 class="text-white font-bold text-sm leading-tight tracking-tight">PIEMONTE ENGENHARIA</h1>
          <p class="text-[10px] text-blue-400 font-medium">Replanejamento Físico-Financeiro & Linha de Balanço</p>
        </div>
      </div>

      <!-- Active Project Indicator -->
      <div class="hidden sm:flex items-center space-x-2 bg-slate-800/90 px-3 py-1 rounded-full border border-slate-700">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <span class="text-[11px] text-slate-400">Obra:</span>
        <span class="text-[11px] font-bold text-white tracking-wide" x-text="activeProject ? activeProject.name : 'Carregando...'"></span>
      </div>

      <!-- Right Header Actions -->
      <div class="flex items-center space-x-2">
        <button 
          @click="showUploadModal = true" 
          class="flex items-center space-x-1.5 bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold px-2.5 py-1.5 rounded-lg shadow-sm transition">
          <i data-lucide="plus-circle" class="w-3.5 h-3.5"></i>
          <span class="hidden sm:inline">Nova Obra</span>
        </button>

        <button 
          @click="showProjectModal = true" 
          class="flex items-center space-x-1 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium px-2.5 py-1.5 rounded-lg border border-slate-700 transition">
          <i data-lucide="folder" class="w-3.5 h-3.5 text-blue-400"></i>
          <span>Obras</span>
        </button>

        <!-- Export Dropdown -->
        <div class="relative" @click.away="showExportMenu = false">
          <div class="inline-flex rounded-lg shadow-sm">
            <button 
              @click="exportExcel('current')" 
              :disabled="isExporting"
              class="flex items-center space-x-1.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold px-3 py-1.5 rounded-l-lg transition disabled:opacity-50"
              :title="'Exportar ' + currentTabLabel">
              <i data-lucide="download" class="w-3.5 h-3.5"></i>
              <span x-text="isExporting ? 'Exportando...' : 'Exportar Excel'"></span>
            </button>
            <button 
              @click="showExportMenu = !showExportMenu" 
              :disabled="isExporting"
              class="bg-emerald-700 hover:bg-emerald-800 text-white px-2 py-1.5 rounded-r-lg border-l border-emerald-600 transition flex items-center justify-center disabled:opacity-50">
              <i data-lucide="chevron-down" class="w-3.5 h-3.5"></i>
            </button>
          </div>

          <!-- Dropdown Menu -->
          <div 
            x-show="showExportMenu" 
            x-cloak
            x-transition
            class="absolute right-0 mt-1.5 w-64 bg-white rounded-xl shadow-xl border border-slate-200 py-1.5 z-50 text-xs">
            <div class="px-3 py-1 text-[10px] font-bold text-slate-400 uppercase tracking-wider">Opções de Exportação</div>
            
            <button 
              @click="exportExcel('current')" 
              class="w-full px-3 py-2 text-left hover:bg-slate-50 flex items-center space-x-2 text-slate-700 font-semibold group">
              <i data-lucide="file-spreadsheet" class="w-4 h-4 text-emerald-600"></i>
              <div>
                <div class="leading-tight">Exportar Tela Atual</div>
                <div class="text-[10px] text-slate-400 font-normal" x-text="currentTabLabel"></div>
              </div>
            </button>

            <button 
              @click="exportExcel('all')" 
              class="w-full px-3 py-2 text-left hover:bg-slate-50 flex items-center space-x-2 text-slate-700 font-semibold group border-t border-slate-100">
              <i data-lucide="layers" class="w-4 h-4 text-blue-600"></i>
              <div>
                <div class="leading-tight">Exportar Pasta Completa</div>
                <div class="text-[10px] text-slate-400 font-normal">Todas as 8 abas consolidadas</div>
              </div>
            </button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Filter & Quick Control Bar -->
  <section class="bg-white border-b border-slate-200 shadow-xs">
    <div class="w-full px-4 sm:px-6 lg:px-8 py-2 flex flex-wrap items-center justify-between gap-3">
      <div class="flex flex-wrap items-center gap-3">
        <!-- Project Dropdown -->
        <div class="flex items-center space-x-1.5">
          <label class="text-[11px] font-bold text-slate-500 uppercase tracking-wider">Obra:</label>
          <select 
            x-model="selectedProjectId" 
            @change="onProjectSelectChange()" 
            class="bg-slate-50 border border-slate-300 text-slate-800 text-xs font-semibold rounded px-2.5 py-1 focus:ring-1 focus:ring-blue-500 outline-none">
            <template x-for="p in projects" :key="p.id">
              <option :value="p.id" x-text="p.name"></option>
            </template>
          </select>
        </div>

        <!-- Cycle Settings -->
        <div class="flex items-center space-x-1.5 bg-slate-50 border border-slate-200 px-2.5 py-1 rounded">
          <i data-lucide="calendar" class="w-3.5 h-3.5 text-blue-600"></i>
          <span class="text-[11px] font-semibold text-slate-600">Ciclo:</span>
          <span class="text-[11px] text-slate-400">Dia</span>
          <input 
            type="number" 
            min="1" 
            max="31" 
            x-model.number="cycleStartDay" 
            @input="onCycleStartChange()"
            class="w-10 text-center text-xs font-bold bg-white border border-slate-300 rounded px-1 py-0.5 outline-none focus:border-blue-500">
          <span class="text-[11px] text-slate-400">ao</span>
          <input 
            type="text" 
            :value="computedCycleEndDayLabel" 
            disabled 
            title="Calculado automaticamente: 1 mês - 1 dia"
            class="w-16 text-center text-xs font-bold bg-slate-100 text-slate-600 border border-slate-200 rounded px-1 py-0.5 outline-none cursor-not-allowed">
          
          <button @click="setPreset(21)" class="text-[10px] px-1.5 py-0.5 rounded font-semibold bg-blue-50 text-blue-700 hover:bg-blue-100">
            21 ao 20 (Platea)
          </button>
          <button @click="setPreset(26)" class="text-[10px] px-1.5 py-0.5 rounded font-semibold bg-slate-200 text-slate-700 hover:bg-slate-300">
            26 ao 25
          </button>
          <button @click="setPreset(1)" class="text-[10px] px-1.5 py-0.5 rounded font-semibold bg-slate-200 text-slate-700 hover:bg-slate-300">
            01 ao Fim do Mês
          </button>
        </div>

        <!-- Cutoff Measurement selector -->
        <div class="flex items-center space-x-1.5 bg-slate-50 border border-slate-200 px-2.5 py-1 rounded">
          <span class="text-[11px] font-semibold text-slate-600">Medição de Corte:</span>
          <select 
            x-model.number="cutoffMedNum" 
            @change="runSimulation()"
            class="bg-white border border-slate-300 text-slate-800 text-xs font-semibold rounded px-2 py-0.5 outline-none">
            <template x-for="i in 36" :key="i">
              <option :value="i" x-text="'Medição ' + i"></option>
            </template>
          </select>
        </div>
      </div>

      <!-- Action Button -->
      <div class="flex items-center space-x-2">
        <button 
          @click="runSimulation()" 
          class="flex items-center space-x-1 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-3 py-1.5 rounded-lg transition shadow-sm">
          <i data-lucide="refresh-cw" class="w-3.5 h-3.5" :class="isLoading ? 'animate-spin' : ''"></i>
          <span>Recalcular</span>
        </button>
      </div>
    </div>
  </section>

  <!-- Main Tabs Bar (8 Tabs) -->
  <nav class="bg-white border-b border-slate-200 shadow-xs">
    <div class="w-full px-4 sm:px-6 lg:px-8">
      <div class="flex space-x-1 overflow-x-auto py-1.5 scrollbar-thin">
        
        <!-- Tab 1 -->
        <button 
          @click="switchTab('dashboard')"
          :class="activeTab === 'dashboard' ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-600 hover:bg-slate-100'"
          class="flex items-center space-x-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold transition shrink-0">
          <i data-lucide="layout-grid" class="w-3.5 h-3.5"></i>
          <span>Visão Geral & Curva S</span>
        </button>

        <!-- Tab 2 -->
        <button 
          @click="switchTab('orcamento')"
          :class="activeTab === 'orcamento' ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-600 hover:bg-slate-100'"
          class="flex items-center space-x-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold transition shrink-0">
          <i data-lucide="file-spreadsheet" class="w-3.5 h-3.5"></i>
          <span>Orçamento (EAP)</span>
        </button>

        <!-- Tab 3 -->
        <button 
          @click="switchTab('cronograma')"
          :class="activeTab === 'cronograma' ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-600 hover:bg-slate-100'"
          class="flex items-center space-x-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold transition shrink-0">
          <i data-lucide="calendar-days" class="w-3.5 h-3.5"></i>
          <span>Cronograma & Versões</span>
        </button>

        <!-- Tab 4 -->
        <button 
          @click="switchTab('distribuicao')"
          :class="activeTab === 'distribuicao' ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-600 hover:bg-slate-100'"
          class="flex items-center space-x-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold transition shrink-0">
          <i data-lucide="git-fork" class="w-3.5 h-3.5"></i>
          <span>Distribuição (Nível 6 & Pesos)</span>
        </button>

        <!-- Tab 5 -->
        <button 
          @click="switchTab('fisico_financeiro')"
          :class="activeTab === 'fisico_financeiro' ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-600 hover:bg-slate-100'"
          class="flex items-center space-x-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold transition shrink-0">
          <i data-lucide="trending-up" class="w-3.5 h-3.5"></i>
          <span>Físico-Financeiro (Base)</span>
        </button>

        <!-- Tab 6 -->
        <button 
          @click="switchTab('medicao')"
          :class="activeTab === 'medicao' ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-600 hover:bg-slate-100'"
          class="flex items-center space-x-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold transition shrink-0">
          <i data-lucide="ruler" class="w-3.5 h-3.5"></i>
          <span>Medição</span>
        </button>

        <!-- Tab 7 -->
        <button 
          @click="switchTab('replanejado')"
          :class="activeTab === 'replanejado' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-600 hover:bg-slate-100'"
          class="flex items-center space-x-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold transition shrink-0">
          <i data-lucide="git-merge" class="w-3.5 h-3.5"></i>
          <span>Replanejado (Saldo Nível 6)</span>
        </button>

        <!-- Tab 8 -->
        <button 
          @click="switchTab('ff_replanejado')"
          :class="activeTab === 'ff_replanejado' ? 'bg-emerald-600 text-white shadow-sm' : 'text-slate-600 hover:bg-slate-100'"
          class="flex items-center space-x-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold transition shrink-0">
          <i data-lucide="check-circle" class="w-3.5 h-3.5"></i>
          <span>Físico-Financeiro Replanejado</span>
        </button>

        <!-- Tab 9: Competência -->
        <button 
          @click="switchTab('competencia')"
          :class="activeTab === 'competencia' ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-600 hover:bg-slate-100'"
          class="flex items-center space-x-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold transition shrink-0">
          <i data-lucide="receipt" class="w-3.5 h-3.5"></i>
          <span>Competência (Contábil)</span>
        </button>

        <!-- Tab 10: Curva Financeira -->
        <button 
          @click="switchTab('financeiro')"
          :class="activeTab === 'financeiro' ? 'bg-teal-600 text-white shadow-sm' : 'text-slate-600 hover:bg-slate-100'"
          class="flex items-center space-x-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold transition shrink-0">
          <i data-lucide="wallet" class="w-3.5 h-3.5"></i>
          <span>Curva Financeira (Caixa)</span>
        </button>

      </div>
    </div>
  </nav>

  <!-- Main Container -->
  <main class="w-full px-4 sm:px-6 lg:px-8 py-4 flex-1 space-y-4">

  </main>

</body>
</html>
